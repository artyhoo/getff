; The quality gate's Vale profile — the ERROR tier and the reported-only SUGGESTION
; tier of D-Q2 (docs/superpowers/specs/2026-09-14-getff-ai-docs-quality-contract-design.md).
;
; Every rule line below maps to a D-Q2 clause:
;   ERROR       Vale.Spelling (vs styles/config/vocabularies/getff/accept.txt)
;               getff.Names     (styles/getff/Names.yml — GENERATED, do not hand-edit;
;                                scripts/render-terms-style.mjs --write owns it)
;   SUGGESTION  the six declared rules, individually enabled, reported never blocking
;   OFF         everything else — nothing outside the lines above runs: Vale.Terms,
;               the ai-tells package, the other five Readability metrics and every
;               undeclared Microsoft rule are absent from this profile on purpose.
;               The Microsoft/Readability packs are vendored ONLY so the six declared
;               suggestions resolve offline; basing on them wholesale would gate the
;               corpus on rules D-Q2 never declared.
;
; docs-check.mjs invokes this profile as
;   vale --config=docs/site-quality/vale/.vale.ini --output=JSON <files>
; and severity-splits the JSON itself (error = gate, suggestion = report). Vale's exit
; code keys off error-tier alerts (measured 3.21.0: suggestion-only runs exit 0), but
; the parser does not depend on that.

StylesPath = styles
MinAlertLevel = suggestion
Vocab = getff

[*.{md,mdx}]
BasedOnStyles = getff
Vale.Spelling = error
Vale.Terms = NO
Microsoft.SentenceLength = suggestion
Microsoft.Passive = suggestion
Microsoft.Contractions = suggestion
Microsoft.Headings = suggestion
Readability.FleschReadingEase = suggestion
Readability.FleschKincaid = suggestion

[*.mdx]
; The MDX twin of the HTML-comment escape (D-Q12) — the two-comment form
; {/* vale off */} + {/* vale-reason: ... */} parses only with this declared.
CommentDelimiters = {/*, */}
