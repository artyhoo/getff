name: workflow-integrity

# R11 — CI integrity, executable form.
# See packages/preset-next-15-canonical/RULES.md#r11--ci-integrity for policy.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [staging, main]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  # actionlint + zizmor moved to audit-self.yml so the single required context
  # `ci-success` can `needs:`-aggregate them (cross-file `needs:` is impossible,
  # and a path-filtered required check deadlocks non-workflow PRs). This workflow
  # now carries only the R11 branch-protection self-assertion.
  branch-protection-assertion:
    # NOTE: this job's `name:` is itself a reported status-check context string —
    # do not rename it casually (see REQUIRED_CONTEXTS below for what it asserts).
    name: ci-success required-check assertion
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Assert every REQUIRED_CONTEXTS check is required on staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tri-state semantics:
          #   - protection or rulesets configured AND include ci-success → pass
          #   - protection or rulesets configured but ci-success missing → fail (R11 violated)
          #   - no protection AND no rulesets → warn (R11 not yet adopted), pass
          # Rationale: don't block PRs in repos that haven't yet configured branch
          # protection. Once configured, R11 enforcement kicks in automatically.

          protection_json="$(gh api "repos/${{ github.repository }}/branches/staging/protection" 2>/dev/null || echo 'null')"
          rulesets_json="$(gh api "repos/${{ github.repository }}/rulesets" 2>/dev/null || echo '[]')"

          has_protection=$(echo "$protection_json" | jq 'if . == null or (type=="object" and has("message")) then false else true end')
          has_rulesets=$(echo "$rulesets_json" | jq 'if type=="array" then [.[] | select(.enforcement == "active")] | length > 0 else false end')

          # REQUIRED_CONTEXTS: every check whose fail-closed property rests on being
          # a REQUIRED status check on staging. `fidelity-verdict-in-pr-body` joined
          # 2026-07-23 (acceptance contour, spec D3): it lives in its own workflow file
          # so it cannot needs:-aggregate into ci-success, which means branch protection
          # is its ONLY fail-closed transport — asserting it here is what keeps that
          # precondition a mechanism rather than #hope-as-gate.
          required_contexts='["ci-success", "fidelity-verdict-in-pr-body"]'

          if [ "$has_protection" = "true" ]; then
            missing="$(echo "$protection_json" | jq -r --argjson want "$required_contexts" \
              '($want - (.required_status_checks.contexts // [])) | join(", ")')"
            if [ -z "$missing" ]; then
              echo "✅ required checks present on staging (classic branch protection): $required_contexts"
              exit 0
            fi
            echo "::error::Branch protection exists on staging but these required status checks are MISSING: ${missing} (R11 violated)."
            echo "::error::Settings → Branches → staging → Require status checks → add: ${missing}"
            exit 1
          fi

          if [ "$has_rulesets" = "true" ]; then
            echo "✅ rulesets active — manually verify ${required_contexts} in https://github.com/${{ github.repository }}/settings/rules"
            exit 0
          fi

          echo "::warning::No branch protection or active rulesets on staging. R11 not yet adopted in this repo."
          echo "::warning::Configure: Settings → Branches → staging → Require status checks → ${required_contexts}"
          exit 0
