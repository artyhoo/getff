name: workflow-integrity

# R11 — observe declared required contexts through ordinary readable branch metadata.
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/check-required-contexts.sh'
  push:
    branches: [staging, main]
    paths:
      - '.github/workflows/**'
      - 'scripts/check-required-contexts.sh'

permissions:
  contents: read

jobs:
  branch-protection-assertion:
    # required-context: no — this workflow is paths-filtered; registering its status would
    # leave unrelated PRs pending forever. Observation is distinct from policy enforcement.
    name: ci-success required-check assertion
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check REQUIRED_CONTEXTS against staging branch metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Derived from per-job required-context declarations; P37 checks exact equality
          # with those declarations and the local sweep. Preserve names verbatim: a rename
          # also needs administrator registration in Settings → Branches → staging.
          required_contexts='[
            "Template render probes — P1/P4/P6 (deterministic)",
            "capability PR carries Prior-art line in PR body (squash-survival)",
            "ci-success",
            "fidelity-verdict-in-pr-body",
            "stale-revert-in-pr-diff",
            "§1.7 forward+backward sections present in PR description"
          ]'

          # 0 concrete complete classic witness; 1 known missing; 2 unverified. Never warn-green.
          bash scripts/check-required-contexts.sh "$required_contexts"
