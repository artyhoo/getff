  framework-self-validate:
    name: Validator v1 — self-application snapshot (L4 invariant)
    runs-on: ubuntu-latest
    needs: principles-meta-tests
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/core/package-lock.json
      - name: Install workspace deps (hoists eslint + ts-eslint)
        run: npm install --silent
      - name: Validate own repo synth output and diff against frozen snapshot
        run: |
          ACTUAL=$(npm --prefix packages/core run validate --silent -- "$GITHUB_WORKSPACE")
          EXPECTED=$(cat packages/core/validator/expected-self-validate.json)
          if ! diff <(echo "$ACTUAL" | jq -S .) <(echo "$EXPECTED" | jq -S .); then
            echo "::error::validator self-application snapshot drift — fix the regression or update packages/core/validator/expected-self-validate.json"
            exit 1
          fi
          echo "✓ self-validate snapshot stable (own repo, all gates pass/n/a)"
      - name: Validate next-16 fixture and diff against frozen snapshot
        run: |
          FIXTURE="$GITHUB_WORKSPACE/packages/core/synthesizer/fixtures/next-16-fixture"
          ACTUAL=$(npm --prefix packages/core run validate --silent -- "$FIXTURE")
          EXPECTED=$(cat packages/core/validator/expected-fixture-validate.json)
          if ! diff <(echo "$ACTUAL" | jq -S .) <(echo "$EXPECTED" | jq -S .); then
            echo "::error::validator fixture snapshot drift — fix the regression or update packages/core/validator/expected-fixture-validate.json"
            exit 1
          fi
          echo "✓ fixture-validate snapshot stable (next-16, all 4 REQUIRED gates pass)"
      - name: Emit aif-gate-result JSON to job summary (Phase 8 — closes Phase 11.1 partial)
        run: |
          # Per AIF SKILL.md "Append machine-readable gate result". Orchestrators
          # downstream of /aif-verify parse this block; emission is non-blocking
          # and structurally compatible with aif-comparison.md §7 11.1.
          GATE_RESULT=$(npm --prefix packages/core run validate --silent -- --aif-gate-result "$GITHUB_WORKSPACE")
          {
            echo '## aif-gate-result (rules)';
            echo '```json';
            echo "$GATE_RESULT";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✓ aif-gate-result emitted to job summary"

  framework-self-install-validated:
    name: Installer v1 — self-application snapshot (L5 invariant)
    runs-on: ubuntu-latest
    needs: principles-meta-tests
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/core/package-lock.json
      - name: Install workspace deps
        run: npm install --silent
      - name: Synth → install → diff deterministic shape vs frozen snapshot
        run: |
          TMP_CONSUMER=$(mktemp -d)
          npm --prefix packages/core run synth --silent -- "$GITHUB_WORKSPACE" > /tmp/synth.json
          npm --prefix packages/core run install:synth --silent -- "$TMP_CONSUMER" --from-synth /tmp/synth.json > /tmp/install-report.json
          SHAPE=$(jq -n \
            --slurpfile r /tmp/install-report.json \
            --slurpfile l "$TMP_CONSUMER/.ai-factory/synthesizer-output/rules-lock.json" \
            '{
              ok: $r[0].ok,
              installed: $r[0].installed,
              failuresCount: ($r[0].failures | length),
              artifactNames: [$r[0].artifacts[] | split("/") | last],
              lockShape: { schemaVersion: $l[0].schemaVersion, framework: $l[0].framework, version: $l[0].version, rules: $l[0].rules },
              preValidation: $r[0].preValidation,
              postValidation: $r[0].postValidation
            }')
          EXPECTED=$(cat packages/core/installer/expected-self-install.json)
          if ! diff <(echo "$SHAPE" | jq -S .) <(echo "$EXPECTED" | jq -S .); then
            echo "::error::installer self-application snapshot drift — fix the regression or update packages/core/installer/expected-self-install.json"
            exit 1
          fi
          echo "✓ self-install snapshot stable (own repo → tmp consumer, lock + post-validate green)"

  framework-provenance-anti-hand-edit:
    name: Provenance v1 — anti-hand-edit gate (S5 invariant)
    runs-on: ubuntu-latest
    needs: principles-meta-tests
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/core/package-lock.json
      - name: Install workspace deps
        run: npm install --silent
      - name: Emit a declarative forbid bundle, verify clean, then prove it reds on a hand-edit
        run: |
          # S5: the synthesizer is the SOLE writer of emitted rule files. This job
          # proves both directions in CI — a clean generator output verifies (exit 0),
          # and a hand-edit of the emitted rule content reds the verifier (exit 1).
          FIXTURE="$GITHUB_WORKSPACE/packages/core/synthesizer/fixtures/s4-declarative-research-plan.json"
          TMP=$(mktemp -d)
          npm --prefix packages/core run synth --silent -- --from-research "$FIXTURE" --output "$TMP" > /dev/null

          # [1] clean bundle must pass.
          set +e
          npm --prefix packages/core run verify:provenance --silent -- "$TMP"
          CLEAN_RC=$?
          set -e
          if [ "$CLEAN_RC" -ne 0 ]; then
            echo "::error::S5 gate red on a freshly-emitted (un-edited) bundle — false positive (rc=$CLEAN_RC)"
            exit 1
          fi
          echo "✓ clean emitted bundle verifies (exit 0)"

          # [2] hand-edit one rule field in the emitted manifest (provenance left stale).
          M="$TMP/rules-manifest-additions.json"
          FIRST=$(jq -r 'keys[0]' "$M")
          jq --arg id "$FIRST" '.[$id].examples.bad += "\n// hand-edited"' "$M" > "$M.tmp"
          mv "$M.tmp" "$M"

          # [3] verifier MUST red on the hand-edit (the прогнанный отказ, not "should bе").
          set +e
          npm --prefix packages/core run verify:provenance --silent -- "$TMP"
          EDITED_RC=$?
          set -e
          if [ "$EDITED_RC" -eq 0 ]; then
            echo "::error::S5 anti-hand-edit gate FAILED to detect a hand-edit (verify exited 0 on a corrupted bundle)"
            exit 1
          fi
          echo "✓ S5 anti-hand-edit gate reds on a hand-edited generated file (exit $EDITED_RC)"

  phase-8-canonical-regen-acceptance:
    name: Phase 8 acceptance — canonical Next 15 regen ≥0.95 similarity
    runs-on: ubuntu-latest
    needs: principles-meta-tests
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/core/package-lock.json
      - name: Install workspace deps
        run: npm install --silent
      - name: Run canonical regen acceptance test (similarity ≥0.95)
        run: npm --prefix packages/core test --silent -- tests/acceptance/canonical-regen

  # actionlint + zizmor live here (moved from workflow-integrity.yml) so the
  # single required context `ci-success` can `needs:`-aggregate them — `needs:`
  # works only WITHIN one workflow file. audit-self has no `paths:` filter, so
  # they run on every PR and the required context always reports; a path-filtered
  # required check would deadlock non-workflow PRs (the bug this fixes).
  # workflow-integrity.yml keeps only the R11 branch-protection-assertion.
  # See docs/meta-factory/automerge-staging-plan.md §5.
  actionlint:
    name: actionlint — YAML & expression correctness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Run actionlint via reviewdog wrapper
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d  # v1.72.0 — pin and bump via Dependabot
        with:
          fail_level: error

  zizmor:
    name: zizmor — supply-chain audits
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55  # v5.5.0
        with:
          python-version: '3.12'
      - name: Install zizmor
        # Pinned for determinism — bumping zizmor is a deliberate edit.
        # 1.25.2 was pinned while 5 adhoc-packages findings (npm install --prefix steps)
        # were triaged. Those findings are now fixed via npm ci --prefix; pin bumped to
        # 1.26.1 so we track the current auditor and its tightened adhoc-packages rules.
        run: pip install zizmor==1.26.1
      - name: Run zizmor
        # Plain console output. zizmor exits non-zero on findings; that's the gate.
        # Avoiding SARIF upload keeps this runnable without GitHub Advanced Security.
        # Also scan the SHIPPED CI templates (#637) so they can't drift past the
        # gate — they live OUTSIDE .github/workflows/, so they are extra path args.
        #
        # The list used to be HAND-MAINTAINED here and in zizmorTemplatesSection()
        # (packages/core/hooks/pre-push.ts, the HARD-gate twin), and it drifted:
        # past cargo/python/react-spa/react-native for 4+ months (#130 → #661/#662/
        # #996/#1080), and then past packages/core/templates/go/github-actions-ci.yml
        # — shipped to every go consumer by setup.d/47-go.sh, scanned by neither twin
        # (ledger A8-4). Two hand-maintained mirrors of an automatically-growing
        # population is a `#warning-nobody-reads` detection layer resting on someone
        # noticing (.claude/rules/attention-is-not-a-mechanism.md §1).
        #
        # So DISCOVER the population instead of restating it: every git-tracked
        # `*github-actions*.yml` outside .github/workflows/ IS a shipped template by
        # construction, and a new preset is covered the moment it is committed. The
        # empty-set guard is load-bearing — a pattern that silently stops matching
        # would turn this gate into a no-op that still reports green.
        run: |
          set -euo pipefail
          # Newline-delimited string + xargs, NOT `mapfile`/arrays: the same block
          # has to stay reproducible by hand on a maintainer Mac, whose /bin/bash is
          # 3.2 (no mapfile; `${#arr[@]}` on an empty array trips `set -u`). Tracked
          # workflow paths carry no whitespace, so word-splitting via xargs is safe.
          # `|| true` keeps the empty case reaching the explicit error below instead
          # of dying on grep's exit 1 under `set -e`.
          TEMPLATES="$(git ls-files '*github-actions*.yml' | grep -v '^\.github/' | sort || true)"
          if [ -z "$TEMPLATES" ]; then
            echo "::error::zizmor template discovery matched NOTHING — the shipped-template scan would be a silent no-op"
            exit 1
          fi
          printf 'Scanning %s shipped CI template(s):\n' "$(printf '%s\n' "$TEMPLATES" | wc -l | tr -d ' ')"
          printf '%s\n' "$TEMPLATES" | sed 's/^/  /'
          printf '%s\n' "$TEMPLATES" | xargs zizmor --format plain .github/workflows/

  # enforcement-liveness-fix S5: f17 planted-violation test on Node 20 + 22 matrix.
  # Scoped to f17 only — proves barrel loads without tsx loader on both LTS versions.
  f17-node-compat:
    name: "f17 lint-rules planted-violation (Node ${{ matrix.node }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/core/package-lock.json
      - name: Install workspace deps (provides tsx + tsc for barrel compilation)
        run: npm install --silent
      - name: Install packages/core deps (provides eslint binary for Arm ii)
        run: npm ci --prefix packages/core --silent
      - name: "f17 lint-rules planted-violation (Node ${{ matrix.node }})"
        run: bash tests/install-sh/f17-lint-rules-planted-violation.test.sh

  # ── Consumer-matrix acceptance cells (one job, one dimension per cell) ──────
  # Four cells used to be four top-level jobs (ledger S-8): the SAME 11-line
  # checkout / setup-node / `bash tests/consumer-matrix/<cell>.sh` skeleton with
  # FRAMEWORK_ROOT, differing only in the script name and one optional deps step.
  # The duplication was not cosmetic — every runner-wide change had to be applied
  # four times or the cells drifted, and the setup-node cache block (f75e15a696)
  # was in fact replicated per cell after the fact. One job with a matrix
  # dimension makes the runner shape single-sourced and `ci-success.needs` list
  # one entry instead of N.
  #
  # WHY the cell SCRIPT PATH is still written out literally per cell, instead of
  # the obvious `run: bash tests/consumer-matrix/${{ matrix.cell }}`:
  # `scripts/run-local-ci-sweep-coverage.test.sh` reconciles this workflow against
  # the local sweep's gate table, and it can only see SINGLE-LINE `run:` steps
  # whose artifact path is a literal token (its CEILING comment + `sig_tokens`/
  # `artifact_of`). Interpolating the path — via `${{ matrix.cell }}` or an env
  # indirection — erases the token, and a `case`/multi-line `run: |` block drops
  # out of its population entirely: all four cells would silently leave the
  # coverage comparison and their UNREACHABLE allowlist entries would go stale.
  # That is the exact silent-hole shape that gate exists to close, so the literal
  # `if:`-guarded steps are load-bearing, not clumsiness. Collapse them the moment
  # that test learns the interpolated form.
  #
  # Per-cell rationale is preserved with each step below. All cells: fail-closed
  # (a missing tool is RED, never SKIP), deterministic + API-free per
  # no-paid-llm-in-ci.md §1, actions exact-pinned per ci-tool-pinning.md Rule A.
  consumer-matrix:
    name: "Consumer-matrix — ${{ matrix.label }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One red cell must not cancel the others: each cell is an independent
      # acceptance claim, and a partial matrix hides which claims still hold.
      fail-fast: false
      matrix:
        include:
          - cell: pnpm-monorepo
            label: "start cell — pnpm workspace monorepo (launch-preannounce-track S2)"
          - cell: python-unfamiliar-stack
            label: "W6 cell — python unfamiliar-stack e2e (getff-any-stack-trace S4)"
          - cell: npm-tarball
            label: "npm-tarball cell — files allowlist + bin runnability (beta-delivery-ux R1)"
          - cell: getff-dist
            label: "getff-dist cell — npx getff init from the assembled tarball (npm-publish-getff-init S2)"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/core/package-lock.json
      - name: Enable pnpm via corepack (the fixture is a pnpm workspace monorepo)
        if: matrix.cell == 'pnpm-monorepo'
        run: corepack enable
      # tsx lives in packages/core/node_modules — the W6 cell invokes
      # `npx --no-install tsx ... rule-bootstrap-cli.ts` at cell:300-303 from
      # $FRAMEWORK_ROOT (root), so tsx must resolve from root/node_modules.
      # Pattern B: npm ci --prefix packages/core installs packages/core's own
      # deps, then the workspace install hoists tsx to root where the cell's
      # cd-root invocation finds it. Without these steps the cell fails at the
      # Tier-1 generation arm with "tsx not found". Container masks this via
      # ambient /app/node_modules + /home/node/.npm-global —
      # destination-environment-verification.md §2 incident-1 pattern (caught by
      # round-1 rework review 2026-08-07).
      - name: Install packages/core deps (tsx for rule-bootstrap-cli)
        if: matrix.cell == 'python-unfamiliar-stack'
        run: npm ci --prefix packages/core --silent
      - name: Install workspace deps (hoists tsx to root)
        if: matrix.cell == 'python-unfamiliar-stack'
        run: npm install --silent
      # launch-preannounce-track S2: runs the real `install.sh ts-server --full`
      # into a FRESH pnpm workspace monorepo fixture (the fixture installs its OWN
      # deps — T-LPT-A) and asserts the umbrella §1 acceptance through the real
      # channels: self-verify verdict honesty (a), in-fixture toolchain + placed-
      # config load (b), the deterministic per-workspace validation gates
      # green-on-clean (c), a planted R2 violation blocked via scoped eslint + the
      # lint-staged pre-commit shield + check:fences-fire (d), the false-positive
      # arm (e), and a clean-tree real git push (i). XFAIL #973 (root `eslint .` on
      # a per-workspace monorepo) is pinned as reproducing. Fixture is
      # S1-calibrated (s1-calibration-report.md §4).
      - name: Run the consumer-matrix start cell
        if: matrix.cell == 'pnpm-monorepo'
        run: bash tests/consumer-matrix/pnpm-monorepo-cell.sh
        env:
          FRAMEWORK_ROOT: ${{ github.workspace }}
      # getff-any-stack-trace S4 (spec §9.1 W6 cell v1): python unfamiliar-stack
      # e2e — scripted fresh python project (FastAPI/SQLAlchemy-class, master
      # default branch) → install.sh python under Node-stripped PATH (proves F-A
      # DECLARE on the install path) → assert the S2 agent surface (4 skills +
      # curated 2 agents + hooks + .mcp.json + AGENTS.md + .ai-factory/ + .getff/)
      # → committed Tier-1-provenance practice fixture → rule-bootstrap-cli
      # --from-practice resolves Tier-1 via vendored .dist-info METADATA
      # (`Project-URL: Documentation, <url>`, the D7 host-derivation surface) →
      # RED arm: ast-grep fires non-zero on planted print() → GREEN arm: ast-grep
      # silent on conforming logger.info() → REJECT arm: a practice citing a
      # non-direct-dep package is downgraded to research-only (FF2007, honest
      # degrade) → R1-input: delivered workflow trigger carries `branches:
      # [master]` (deliver_getff_workflow substitutes via git symbolic-ref
      # origin/HEAD). A cell that only passes is `#discipline-theatre` with a
      # workflow file attached — the RED/GREEN/REJECT arms ARE the §3 «works»
      # claim, not a green-CI narrative. ast-grep pinned per ci-tool-pinning.md.
      - name: Run the consumer-matrix W6 cell (python unfamiliar-stack e2e)
        if: matrix.cell == 'python-unfamiliar-stack'
        run: bash tests/consumer-matrix/python-unfamiliar-stack-cell.sh
        env:
          FRAMEWORK_ROOT: ${{ github.workspace }}
      # beta-delivery-ux R1 (spec A6): packs `packages/core` into a tarball,
      # installs it into a fresh fixture (no registry needed — install by path),
      # and asserts the real consumer path: manifest loads, by-path assets exist
      # (install bundle, manifest schema, eslint-rules, templates/, skills/),
      # every `bin:` and `exports:` target resolves, and ≥1 bin executes
      # end-to-end from the installed package (F-C′ resolution: tsx as runtime
      # dep). This cell IS the `files` allowlist validation mechanism per kickoff
      # §3 — every entry in `packages/core/package.json:files` carries paired
      # RED→GREEN evidence from this cell. A green `npm pack` is NOT a gate
      # (T-BDU-R1-A); only installing + running the consumer path is.
      - name: Run the consumer-matrix npm-tarball cell
        if: matrix.cell == 'npm-tarball'
        run: bash tests/consumer-matrix/npm-tarball-cell.sh
        env:
          FRAMEWORK_ROOT: ${{ github.workspace }}
      # npm-publish-getff-init U10 (S2): the `npx getff init` gate. The `getff`
      # distribution package is ASSEMBLED from the repo root
      # (scripts/build-getff-dist.sh; committed artefact =
      # packages/getff/MANIFEST.sha256). This cell is what makes that package
      # TRUE: drift gate → npm pack → npm i <tarball> into a fresh consumer →
      # `getff init -y ts-server` → a planted OrderSchema.parse(req.body) under
      # src/routes/ must FAIL eslint with the R2 message. «Published → installs
      # cleanly» is not the assertion (T-NPI-A); the first violation failing is.
      # The consumer install fetches the ts-server dev-deps from the registry
      # exactly as a real `npx getff init` would.
      - name: Run the consumer-matrix getff-dist cell
        if: matrix.cell == 'getff-dist'
        run: bash tests/consumer-matrix/getff-dist-cell.sh
        env:
          FRAMEWORK_ROOT: ${{ github.workspace }}

  # Single aggregate context for branch protection. `needs:` every other
  # audit-self PR job — including actionlint + zizmor above — so requiring just
  # `ci-success` gates them all, and stays correct as jobs are added/removed (vs
  # listing each context in protection, which silently drifts). if: always() so
  # the gate still runs (and can FAIL) when a need failed; pass/fail logic lives
  # in scripts/ci-success-gate.sh (paired-negative tested).
  ci-success:
    # required-context: yes — the single aggregate every other audit-self job routes into via
    # `needs:` (completeness asserted by packages/core/principles/36-ci-needs-completeness.test.ts);
    # nothing else in this file is separately registrable, so this is its only fail-closed transport.
    name: ci-success
    if: always()
    needs:
      - mechanical
      # ci-needs-completeness gap (found by the beta-delivery-ux R1 backward sweep, fixed
      # here): without this line the shipped surface could drift off Prettier-clean while
      # `ci-success` stayed green and the PR merged — every consumer's first
      # `prettier --check .` then fails out-of-box (the GH #531 regression this job exists
      # to prevent). Never wired since the job shipped in #540 (`git log -S` on the needs
      # entry returns empty) — the `#warning-nobody-reads` shape
      # (.claude/rules/attention-is-not-a-mechanism.md §2), now gated by principle 36.
      - shipped-prettier
      - actionlint
      - zizmor
      - rule-to-probe
      - probe-tests
      - manifest-render-check
      - principles-meta-tests
      - install-sh-a
      - install-sh-b
      - install-sh-c
      - typecheck
      - pr-commit-trailers
      - enforce-husky-presence
      - framework-self-install-ts-server
      - framework-self-install-react-next
      - framework-fresh-install-validate
      # Same ci-needs-completeness gap. Without this line the #807 monorepo cell could go
      # RED while `ci-success` stayed green and the PR merged: the flat-matrix job above
      # only covers a SINGLE-package consumer, so this is the ONLY surface asserting that
      # check:globs / check:enforced / arch:check survive a no-root-config multi-stack
      # layout. A green `ci-success` alone proves none of those three gates. Never wired
      # since the job shipped in #815.
      - framework-fresh-install-validate-multistack
      - framework-self-detect
      - framework-self-research
      - framework-self-synth
      - framework-self-validate
      - framework-self-install-validated
      - framework-provenance-anti-hand-edit
      - phase-8-canonical-regen-acceptance
      - f17-node-compat
      # The four consumer-matrix acceptance cells are ONE job with a matrix
      # dimension (ledger S-8); `needs:` a matrix job waits on EVERY cell, so this
      # single line carries what four lines carried before. Without it any cell
      # could go RED while `ci-success` stayed green and the PR merged, because
      # branch protection requires only `ci-success` — the `#warning-nobody-reads`
      # shape (.claude/rules/attention-is-not-a-mechanism.md §2). What a green
      # `ci-success` alone proves NOTHING about, per cell: the start cell's
      # self-verify/planted-R2/false-positive arms (launch-preannounce-track S2);
      # the W6 cell's RED/GREEN/REJECT discrimination arms (getff-any-stack-trace
      # S4); the tarball cell's paired RED→GREEN evidence per `files` entry + the
      # F-C′ bin execution (beta-delivery-ux R1); the getff-dist cell's planted
      # violation failing from the installed tarball (npm-publish-getff-init U10
      # S2). Principle 36 gates the mirror.
      - consumer-matrix
      # arch-v2 S-E P3a. Without this line the budget job could go RED while
      # `ci-success` stayed green and the PR merged, because branch protection
      # requires only `ci-success` — a gate whose sole consumer is someone
      # reading the checks list (`#warning-nobody-reads`,
      # .claude/rules/attention-is-not-a-mechanism.md §2). Caught by the round-1
      # cold fidelity audit of the S-E stage.
      - alwayson-budget
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Aggregate required-job results
        # results via env (not inline ${{…}} in run:) to avoid template-injection
        # (zizmor). The tokens are GitHub-controlled (success|failure|skipped|
        # cancelled); word-split intentionally into one arg per needed job.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # shellcheck disable=SC2086  # intentional word-split: one arg per job result
          bash scripts/ci-success-gate.sh $RESULTS
