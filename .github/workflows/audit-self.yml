name: audit-self

on:
  push:
    branches: [staging, main, 'chore/**']
  pull_request:
  merge_group:

jobs:
  mechanical:
    name: Mechanical checks (bash, json, dead links)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Bash syntax of all *.sh
        run: |
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f" 2>err.log; then
              echo "::error file=$f::syntax error"
              cat err.log
              fail=1
            fi
          done < <(find . -name "*.sh" -not -path "./.git/*")
          exit "$fail"

      - name: JSON validity of all *.json
        run: |
          fail=0
          while IFS= read -r f; do
            if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" 2>err.log; then
              echo "::error file=$f::invalid JSON"
              cat err.log
              fail=1
            fi
          done < <(find . -name "*.json" -not -path "./.git/*" -not -path "./node_modules/*")
          exit "$fail"

      - name: No file > 500 lines (markdown)
        # Gate logic extracted to a unit-testable script (single source) so the
        # exemptions — EXECUTION-PLAN.md, research-patches/, and committed durable
        # kickoff.md design docs (cross-session kickoff portability, SSOT #116) —
        # ship with a paired positive+negative test. See md-line-gate.test.ts.
        run: bash packages/core/audit-self/md-line-gate.sh .

      - name: Dead-link check (.md → .md)
        run: |
          while IFS= read -r src; do
            # shellcheck disable=SC2016  # regex literal, no expansion intended
            grep -oE '`[^`]*\.md`' "$src" 2>/dev/null | tr -d '`' | sort -u | while read -r ref; do
              case "$ref" in
                # AIF convention rename targets (template → final name) — not real files in the repo
                *.ai-factory/*|*AGENTS.md|*CLAUDE.md|*DESCRIPTION.md|*ARCHITECTURE.md|*.template.md|*\<*) continue ;;
                docs/architecture.md) continue ;;  # used as anti-pattern example
              esac
              base=$(basename "$ref")
              if ! find . -name "$base" -not -path "./.git/*" 2>/dev/null | grep -q .; then
                echo "::warning file=$src::dead .md reference → $ref"
              fi
            done
            # historical audit reports may reference suggested filenames / anti-patterns
          done < <(find . -name "*.md" -not -path "./.git/*" -not -name "audit-results-*.md" -not -path "./docs/audits/*")

      - name: Research patch scope annotations
        run: |
          fail=0
          while IFS= read -r f; do
            [[ "$(basename "$f")" == "README.md" ]] && continue
            first=$(head -1 "$f")
            if [[ "$first" != "<!-- scope:"* ]]; then
              echo "::error file=$f::missing <!-- scope:... --> annotation on first line"
              fail=1
            fi
          done < <(find docs/meta-factory/research-patches -maxdepth 1 -name "*.md")
          exit "$fail"

      - name: Stale path references
        run: |
          fail=0
          # Excludes orchestrator-prompts/: kickoffs are committed historical design
          # docs (cross-session kickoff portability, SSOT #116) that legitimately quote
          # now-removed artifacts as audit subjects (e.g. an audit kickoff whose job is
          # to remove the stale ref). The guard targets canonical/shipped docs.
          if grep -rn "ai-factory-RULES\.md" --include="*.md" --include="*.sh" --exclude-dir=orchestrator-prompts .; then
            echo "::error::stale 'ai-factory-RULES.md' reference (renamed to factory/RULES.md)"
            fail=1
          fi
          if grep -rn "best-practices-sidecar\.react\.md" --include="*.md" --exclude-dir=orchestrator-prompts .; then
            echo "::error::stale 'best-practices-sidecar.react.md' reference (was inlined)"
            fail=1
          fi
          exit "$fail"

      - name: "Pre-merge carrier self-tests (pre-merge-carrier-build B1: live-fire arms 1-10 + probe P1/P2)"
        # T-PMC-D: every arm RUNS the real carrier/probe against throwaway fixture repos
        # and asserts output + exit code — never greps the scripts' source text.
        run: bash packages/core/audit-self/pre-merge-local.test.sh

      - name: "Mutation runner root-resolution self-tests (issue 1459: worktree-under-hook + plain-clone + direct-invocation arms)"
        # Live-fire: real bare remote + linked worktree + pre-push hook + a real push.
        # Asserts the runner's resolved root is <worktree>, not <worktree>/scripts,
        # via the manifest-absent die message — never a grep of the runner's source.
        run: bash packages/core/synthesizer/run-generated-rule-mutation.test.sh

  shipped-prettier:
    name: Shipped artifacts are Prettier-clean (GH #531 dogfood)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/core/package-lock.json
      # The framework never ran its own authored shipped artifacts (skill docs, agent prompts,
      # ESLint-rule sources, config templates) through Prettier, so install delivered ~50 files
      # that fail a consumer's first `prettier --check .` (#531). This gate fails when any shipped
      # source drifts from Prettier — keeping "one button → green validate" true out-of-box.
      # Deterministic (Prettier, not an LLM) — complies with no-paid-llm-in-ci.
      #
      # Since GH #1378 the script also checks the DELIVERED shape, not just the source: install.sh
      # rewrites repo-internal refs into blob URLs AFTER the copy (transform_internal_refs), and a
      # rewrite inside a table cell re-pads the table, so a source-clean file can ship dirty. That
      # phase materialises each transform-routed doc at its consumer-final path and re-checks it.
      # GH #1377's half is the population: `.claude/skills` is enumerated whole rather than as a
      # hand-maintained allowlist of slugs, which had drifted eight shipped skills out of the gate.
      # Paired negative: tests/install-sh/delivered-prettier-conformance.test.sh.
      - name: npm run format:check (shipped surface only)
        run: npm run format:check
  rule-to-probe:
    name: Rule-to-probe mapping
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Every R-rule has probe / manual / ESLint delegation
        run: |
          fail=0
          for rules_file in packages/preset-next-15-canonical/RULES.md packages/preset-next-15-canonical/RULES.react-next.md; do
            # ^## R<digits>[<lowercase>]?  — matches R1..R20, R16a/R16b; excludes "## Rule maintenance"
            while IFS= read -r r; do
              in_audit=0
              # skip_unless R<n>[a-z]*  — covers R16 → R16a/R16b sub-probes
              # Wave 10.4: also grep *.ts (audit-ai-docs.ts replaced audit-ai-docs.sh)
              grep -qE "skip_unless ${r}[a-z]*\b" packages/core/audit-self/*.sh packages/core/audit-self/*.ts packages/preset-next-15-canonical/audit-self/*.sh 2>/dev/null && in_audit=1
              in_manual=0
              # Wave 10.4: agents/best-practices-sidecar.md removed in PR #79; markers now in *.ts.
              # Use find+xargs to avoid nonexistent-file exit-code-2 masking valid matches.
              if find packages/core/audit-self packages/preset-next-15-canonical/audit-self \( -name "*.sh" -o -name "*.ts" \) -print0 2>/dev/null | \
                 xargs -0 grep -qE "$r.*manual|manual.*$r|$r.*delegated|delegated.*$r" 2>/dev/null; then
                in_manual=1
              fi
              if [ "$in_audit" -eq 0 ] && [ "$in_manual" -eq 0 ]; then
                echo "::error::orphan rule $r — no probe, no manual review note, no delegation"
                fail=1
              fi
            done < <(grep -oE "^## R[0-9]+[a-z]?" "$rules_file" | grep -oE "R[0-9]+[a-z]?")
          done
          exit "$fail"

  probe-tests:
    name: Negative tests for audit probes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/core/package-lock.json
      - name: Install packages/core deps (remark + vitest for audit-ai-docs.test.ts)
        run: npm ci --prefix packages/core --silent
      - name: Run packages/core/audit-self/audit-ai-docs.test.ts (Wave 10.4 — vitest)
        run: |
          if [ -f packages/core/audit-self/audit-ai-docs.test.ts ]; then
            npx --prefix packages/core vitest run --reporter=default packages/core/audit-self/audit-ai-docs.test.ts
          else
            echo "::error::packages/core/audit-self/audit-ai-docs.test.ts missing"
            exit 1
          fi
      # First-Steps SSOT ↔ AI Usage Guide parity (beta-ai-docs-agnosticism S1). Registered by
      # NAME, not via an `audit-self/` directory scope: a directory sweep would also pull in
      # currently-unregistered neighbours, which is scope this umbrella did not ask for.
      # The else-arm is load-bearing — a silently-vanished gate is the failure being closed here.
      - name: Run packages/core/audit-self/first-steps-parity.test.ts (beta-ai-docs-agnosticism S1)
        run: |
          if [ -f packages/core/audit-self/first-steps-parity.test.ts ]; then
            npx --prefix packages/core vitest run --reporter=default packages/core/audit-self/first-steps-parity.test.ts
          else
            echo "::error::packages/core/audit-self/first-steps-parity.test.ts missing"
            exit 1
          fi

  manifest-render-check:
    name: Manifest → RULES.md drift check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/core/package-lock.json
      - name: Install workspace deps (hoists tsx to root)
        run: npm install --silent
      - name: Render & diff
        run: npx tsx packages/core/render/render-rules.ts --check
      # CTX Stage 1: .claude/rules/00-rule-index.md + the AGENTS.md `rule-index` fenced
      # region must stay in sync with each rule's own Class:/Fires:/paths:/globs:
      # header metadata. Run via tsx (the renderer imports packages/core/composition/fence.ts,
      # a .ts module plain node cannot load on Node 20) — matches the render-rules.ts step above.
      - name: Rule-index render & diff (CTX Stage 1)
        run: npx tsx scripts/render-rule-index.mjs --check
      # beta-ai-docs-agnosticism S3: INSTALL-FOR-AI.md `install-roster` getff:begin
      # section must stay in sync with the installer manifests (setup.d/20-agents.sh,
      # setup.d/10-skills.sh, setup.d/lib.sh). Same tsx runner pattern as above.
      - name: Install-roster render & diff (beta-ai-docs S3)
        run: npx tsx scripts/render-install-roster.mjs --check
      - name: Pipeline-presets render & diff (beta-ai-docs S3)
        run: npx tsx scripts/render-presets.mjs --check

  principles-meta-tests:
    name: Principles as meta-tests (Phase 2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0  # principle 11 needs full git history for introducing-commit detection
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/core/package-lock.json
      - name: Install packages/core deps
        run: npm ci --prefix packages/core --silent
      - name: Run principles meta-tests
        run: npm --prefix packages/core run test:principles
      # MT umbrella S1: packages/core/ir/ (Convention IR grammar gate) is a new vitest
      # include-allowlist entry (vitest.config.ts) — gate it here, reusing the
      # `npm ci --prefix packages/core` install above (same job, no new job/npm-ci).
      - name: Run packages/core/ir tests (MT S1)
        run: npm --prefix packages/core run test:ir
      # MT umbrella S1 (python-backend-v0): the astgrep-python-yaml backend's live-fire tests
      # (packages/core/backends/astgrep/firing.test.ts + capability-matrix.test.ts) fire the bare
      # PATH `ast-grep` binary FOR REAL in CI (owner STOP-line: no `!isCI` guard). The tool is NOT
      # a package.json dependency — it comes via this hard, exact-pinned global install. A pin (not
      # a float/`latest`) keeps the fired toolchain deterministic and matched to the committed
      # capability-matrix evidence (ast-grep 0.44.1); a hard install fails loud-red on a registry
      # flake rather than loud-skipping CI green (which an npx-resolved pin would do). Pinned per
      # .claude/rules/ci-tool-pinning.md Rule A. zizmor adhoc-packages is suppressed on this line:
      # the audit wants lockfile-backed installs, but a global CLI tool has no lockfile surface —
      # the exact `@0.44.1` pin is the determinism mechanism here (same posture as the pinned
      # `pip install zizmor==` install below).
      - name: Install pinned ast-grep for astgrep backend live-fire (MT S1)
        run: npm install -g @ast-grep/cli@0.44.1 # zizmor: ignore[adhoc-packages]
      # MT umbrella S2 (python-backend-v0): the ruff-tidy-imports-toml backend's live-fire tests
      # (packages/core/backends/ruff/firing.test.ts + capability-matrix.test.ts) fire the bare PATH
      # `ruff` binary FOR REAL in CI (owner STOP-line: no `!isCI` guard), same posture as the ast-grep
      # install above. ruff is NOT a package.json dependency — it comes via this hard, exact-pinned
      # `pip install ruff==0.15.21`. The pin (not a float) keeps the fired toolchain deterministic and
      # matched to the committed capability-matrix evidence (ruff 0.15.21); a hard install fails
      # loud-red on a registry flake rather than loud-skipping CI green (which a uvx-resolved pin would
      # do). Pinned per .claude/rules/ci-tool-pinning.md Rule A.
      - name: Install pinned ruff for ruff backend live-fire (MT S2)
        run: pip install ruff==0.15.21
      # ecosystem-wiring W4 (operator challenge 2026-07-21, superseding the LG-S3-era
      # "dev-machine-only" caveat): the cargo backend live-fire (backends/cargo/firing.test.ts
      # R7/R8/R8b) + the researched-cargo live-fire (synthesizer/live-generation-clippy.test.ts
      # AC2) now fire FOR REAL in CI. The runner is plain ubuntu-latest and the ast-grep/ruff
      # precedent (hard exact-pinned installs above) extends directly to rust. Cache the pinned
      # rustup toolchain so the ~200MB install is not re-downloaded every run (first-party cache,
      # SHA-pinned; correctness-neutral — a miss only makes the next step slower).
      - name: Cache pinned rust toolchain (ecosystem-wiring W4)
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
          key: rust-toolchain-1.96.1-${{ runner.os }}
      # The cargo fixtures pin rust-toolchain.toml channel=1.96.1; installing that EXACT toolchain
      # + the clippy component and making it the default makes `cargo clippy` (in a fixture dir)
      # AND `rustc --version` (the freshness anchor, run from the packages/core cwd) both resolve
      # rustc 1.96.1 (31fca3adb 2026-06-26) — the SAME toolchain the committed capability-matrix
      # evidence was fired against, so no false-RED from the runner's default rust. The rustc
      # toolchain-freshness gate (capability-matrix.test.ts checkToolchainFreshness) turns RED if
      # the resolving rustc ever drifts from the evidence — the deriveToolVersion analog for rust.
      # Exact-pinned (1.96.1, not a channel float) per .claude/rules/ci-tool-pinning.md Rule A —
      # same posture as the ast-grep/ruff pins above; a pin bump is a deliberate edit that bumps
      # this line + the fixtures' rust-toolchain.toml + the committed evidence in tandem.
      - name: Install pinned rust toolchain + clippy for cargo backend live-fire (ecosystem-wiring W4)
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.1 --profile minimal --component clippy
          rustup default 1.96.1
          rustc --version
          cargo clippy --version
      # adapter-jig J3: the go CI arm. The go EcosystemAdapter has NO backends/go/ capability-matrix
      # (E3 PARKED — see PR body §5 «E3 park» for Option A vs Option B with consequences), so the
      # arm does NOT run a vitest include-allowlist like MT S2's test:backends. Instead it proves
      # E1 red/green directly: install the exact-pinned go toolchain + golangci-lint, then run
      # `install.sh go` against a scratch fixture so the lane's _go_firing_self_check (F8) fires
      # FOR REAL against the pinned binary (kickoff §1.3: where the E1 red/green proof actually
      # lands — T-EW-C posture: until the runner arm is green and linked, E1 is unproven).
      #
      # F10 two-surface pin parity (arm P1): the framework pin strings here MUST match the consumer
      # template at packages/core/templates/go/github-actions-ci.yml; bump them in lockstep.
      # MAJOR 1 fix (pre-egress fidelity audit 2026-07-25): `go version` only PRINTS — it does not
      # pin. We use actions/setup-go@<SHA> with go-version: '1.22.0', exactly like the consumer
      # template, so a runner-default bump can never silently change the toolchain while the cache
      # key still reads go-1.22.0. Both surfaces now carry a real pin string that must move together.
      - name: Install pinned go toolchain (adapter-jig J3)
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version: '1.22.0'
          cache: false
      # MINOR fix (fidelity audit round 2): the binary path was `${{ env.GOBIN }}`, but GOBIN is
      # unset workflow-wide, so that entry expanded to empty and golangci-lint itself was never
      # cached — only the module + build caches were. `go install` writes to $(go env GOPATH)/bin,
      # which is ~/go/bin on the runner (the same path the next step invokes by absolute path).
      - name: Cache go module + golangci-lint binaries (adapter-jig J3)
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/bin
          key: go-mod-1.22.0-golangci-v1.55.2-${{ runner.os }}
      - name: Install pinned golangci-lint for go lane live-fire (adapter-jig J3)
        run: |
          set -euo pipefail
          # Exact-pinned golangci-lint @ v1.55.2 (ci-tool-pinning.md Rule A — the pin lives in the @tag).
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.55.2
          # MINOR 5 fix (pre-egress fidelity audit 2026-07-25): GITHUB_PATH only takes effect on
          # SUBSEQUENT steps, so a same-step `golangci-lint --version` under `set -euo pipefail`
          # would die if $GOPATH/bin is not already on PATH. Invoke by absolute path here; the
          # next step finds golangci-lint on PATH via the setup-go-added $GOPATH/bin.
          "$(go env GOPATH)/bin/golangci-lint" --version
      - name: Run getff go lane live-fire (adapter-jig J3)
        run: |
          set -euo pipefail
          # Scratch fixture: a fresh Go module in an OS temp dir, then install.sh go fires the lane's
          # _go_firing_self_check (F8). The self-check plants a violating .go file (os.Getenv) in its
          # OWN mktemp -d, asserts golangci-lint fires RED on the violation + GREEN on the clean control,
          # prints ✓-prefixed PASS lines. The self-check returns 0 on EVERY branch by contract (F8
          # mandates rc=0 always so a self-check never aborts install.sh) — so the step cannot rely
          # on exit code alone. We capture the output and grep for the lane's OWN failure markers.
          # MAJOR 2 fix (pre-egress fidelity audit 2026-07-25): the previous version asserted only
          # artefact existence, which proves DELIVERY but not FIRING — a SILENT or OVER-BROAD config
          # prints its ✗ marker and the step still went GREEN. Now: the step fails on any ✗ / ⚠
          # degrade line (on this runner the toolchain IS present, so a degrade means the install
          # step did not take effect), and asserts the positive «enforcement is live» line is present.
          fixture="$(mktemp -d)"
          printf 'module example.com/j3-livefire\n\ngo 1.22\n' > "$fixture/go.mod"
          cd "$fixture"
          # Tee captures the install.sh output (including _go_firing_self_check markers) to a log
          # AND surfaces it to the GitHub Actions step log for operator visibility.
          bash "$GITHUB_WORKSPACE/install.sh" go 2>&1 | tee /tmp/j3-go-livefire.log
          # Re-affirm the lane delivered the artefacts the firing self-check attested against:
          [ -f "$fixture/.golangci.yml" ] || { echo "❌ J3 live-fire: .golangci.yml not delivered"; exit 1; }
          [ -f "$fixture/.github/workflows/getff-go.yml" ] || { echo "❌ J3 live-fire: getff-go.yml not delivered"; exit 1; }
          [ -f "$fixture/.ai-factory/synthesizer-output/rules-lock.go.json" ] || { echo "❌ J3 live-fire: rules-lock.go.json not emitted"; exit 1; }
          # FIRING assertions (the load-bearing half — artefact existence alone is delivery, not firing):
          #  (a) on this runner go AND golangci-lint ARE present (installed in the previous step),
          #      so a "NOT proven (tool absent)" degrade line means the install did not take effect.
          #  (b) a SILENT config (golangci-lint does not fire on the planted os.Getenv violation)
          #      or an OVER-BROAD one (it fires on the clean control) is a delivery bug; the self-check
          #      prints ✗ for both. The summary line repeats SILENT/OVER-BROAD/NOT proven tokens.
          if grep -E 'SILENT|OVER-BROAD|NOT proven \(tool absent\)|✗' /tmp/j3-go-livefire.log; then
            echo "❌ J3 live-fire: firing self-check produced a failure marker (see lines above)"
            exit 1
          fi
          # Assert the POSITIVE too: the lane MUST print the «enforcement is live» summary, proving
          # both directions fired correctly. Its absence means the self-check did not run at all
          # (a worse failure than a wrong config — the lane silently skipped its own proof).
          if ! grep -F 'enforcement is live' /tmp/j3-go-livefire.log; then
            echo "❌ J3 live-fire: «enforcement is live» summary line absent — self-check did not complete successfully"
            exit 1
          fi
          echo "✓ J3 go lane live-fire: artefacts delivered + firing self-check proven on the pinned go 1.22.0 + golangci-lint v1.55.2 toolchain"
      # MT umbrella S2: packages/core/backends/ (cargo-backend-v0 renderer + firing harness
      # + capability matrix) is a new vitest include-allowlist entry (vitest.config.ts) —
      # gate it here, reusing the `npm ci --prefix packages/core` install above. The cargo
      # live-fire (R7/R8/R8b) fires FOR REAL against the pinned 1.96.1 toolchain installed above
      # (ecosystem-wiring W4) — exactly like the astgrep backend's pinned live-fire; the rustc
      # toolchain-freshness gate keeps that evidence honest. The renderer/routing/registry/matrix-
      # honesty tests are always-on and gate regardless of tool presence.
      - name: Run packages/core/backends tests (MT S2)
        run: npm --prefix packages/core run test:backends
      # MT umbrella S4: packages/core/composition/ (executable-AI-doc plane — DocPlan
      # compose + composition-gate FF8001-8004) is a new vitest include-allowlist entry
      # (vitest.config.ts) — gate it here, reusing the `npm ci --prefix packages/core`
      # install above (same job, no new job/npm-ci). Deterministic, no toolchain.
      - name: Run packages/core/composition tests (MT S4)
        run: npm --prefix packages/core run test:composition
      # live-generation umbrella: its synthesizer/ tests — the live-research → ConventionNode bridges
      # (research-to-node / research-to-clippy-node), the Model A′ byte-drift gates, and the rust
      # always-on capability-evidence validator — were never gated by a CI step (only the astgrep
      # firing tests landed under backends/, test:backends). A test-that-does-not-gate is the
      # #discipline-theatre this project exists to prevent. Gate the umbrella's OWN tests here,
      # reusing the `npm ci --prefix packages/core` install above (same job, deterministic).
      # UN-SCOPED as of 2026-08-10 (principle 38): this step used to run only 3 named synthesizer
      # files because the other 20 import the workspace eslint preset
      # `@rules-as-tests/preset-next-15-canonical`, which `npm ci --prefix packages/core` does not
      # provide (the preset is a workspace sibling, absent from packages/core's own package.json
      # and its standalone lock) → they failed to COLLECT at THIS point in the job. The old comment
      # called wiring them in "a separate task"; that task is done. The fix was placement, not
      # scoping: the root `npm install` below creates the `@rules-as-tests/*` workspace symlinks in
      # the repo-root node_modules, and node resolution from packages/core walks up to find them —
      # so the full `synthesizer/` suite is now run by `test:synthesizer` AFTER that install.
      # The researched-cargo clippy live-fire (live-generation-clippy.test.ts AC2) still fires FOR
      # REAL against the pinned 1.96.1 toolchain installed above (ecosystem-wiring W4 — runLiveFire
      # = cargoPresent, no !isCI); the rust toolchain is job-scoped, so moving the step later keeps
      # it on PATH. The `test:live-generation` script itself is retained for narrow local use.
      # CI-gap option C (hook-test-suite-rot): the packages/core/hooks/ vitest suite was
      # never gated — only principles/ was — which is how a real cross-platform regression
      # (priority-score-synthetic.sh xargs) accumulated 15 failures unnoticed. Gate it here.
      # Root `npm install` hoists tsx to the repo-root node_modules/.bin so the
      # check-doc-authority hook (which spawns $REPO_ROOT/node_modules/.bin/tsx) actually
      # runs rather than graceful-skipping. jq is preinstalled on ubuntu runners; eslint
      # (guard-liveness) comes from the packages/core install above.
      - name: Install workspace deps (hoists tsx to root for the hooks-suite gate)
        run: npm install --silent
      # Ledger A8-6. The prose above claims «jq is preinstalled on ubuntu runners»,
      # and 34 `describe.skipIf(!JQ)` blocks across 19 suites in packages/core/hooks/
      # rest on that claim. A premise nobody asserts is not a mechanism
      # (.claude/rules/attention-is-not-a-mechanism.md §1): measured on a
      # jq-stripped PATH, hooks/inject-matching-rule.test.ts goes from «12 passed»
      # to «12 skipped» and vitest still exits 0 — a runner-image change would EMPTY
      # every one of those suites while this job reported green. One assertion turns
      # that silent degrade into a loud red; editing 34 describe blocks to each
      # re-derive the same premise would not.
      - name: Assert jq is on PATH (34 skipIf(!JQ) blocks in the hooks suite need it)
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is NOT on PATH — every describe.skipIf(!JQ) suite under packages/core/hooks/ would report green while running nothing"
            exit 1
          fi
          jq --version
      - name: Run packages/core/hooks/ suite (CI-gap option C — gate the hooks suite)
        run: npm --prefix packages/core run test:hooks
      # ── vitest include-allowlist coverage (principle 38, 2026-08-10) ─────────────────────
      # Before this block, 87 *.test.ts files across 12 include-allowlist directories had ZERO
      # CI invocation (skills 22, research 22, validator 16, eslint-rules 7, detector 7,
      # installer 4, scenario-generator 2, diff 2, diagnostics 2, detector-v0 1, spec-validation
      # 1, python-starter 1), plus partial coverage of synthesizer (3/23), install (2/5) and
      # audit-self (3/6). A test wired at no channel fails at none — the #armed-but-not-fired
      # false-green. `principles/38-vitest-include-ci-coverage.test.ts` now asserts this list
      # cannot fall behind `vitest.config.ts` again; it reads THESE steps to decide coverage,
      # so deleting one turns the principles suite RED at pre-push, before CI.
      #
      # Placement is load-bearing: all three steps run AFTER the root `npm install` above,
      # because `validator/gate-*.ts`, `install/rule-bootstrap-cli.ts` and
      # `synthesizer/generate-react-spa.test.ts` import `@rules-as-tests/preset-next-15-canonical`
      # — a workspace sibling that only exists in node_modules once the root install has linked
      # it. Moving them above that install reproduces the collection failure this block fixes.
      - name: Run packages/core deterministic unit suites (principle 38 — 12 previously-unwired dirs)
        run: npm --prefix packages/core run test:units
      # Split out from test:units: every case spawns a real bash helper against a sandbox tree,
      # so this is the slow arm (~90s locally, 211 tests) and deserves its own attributable step.
      - name: Run packages/core/skills/ suite (principle 38)
        run: npm --prefix packages/core run test:skills
      # Split out because it is the only suite in the package that touches the network: it shells
      # out to the real `gh` CLI to resolve action SHAs against the GitHub API. GH_TOKEN makes
      # those calls authenticated so the assertions are real rather than uniformly rate-limited
      # into the exit-2 "tooling unavailable" branch that the tests tolerate by design.
      - name: Run packages/core/spec-validation/ suite (principle 38)
        run: npm --prefix packages/core run test:spec-validation
        env:
          GH_TOKEN: ${{ github.token }}
      # Full synthesizer/ — supersedes the narrow 3-file test:live-generation step above; see the
      # UN-SCOPED note there for why it had to move below the root install.
      - name: Run packages/core/synthesizer/ suite (principle 38 — was 3/23 files)
        run: npm --prefix packages/core run test:synthesizer
      # #752 fix (Variant A): rule .mjs/.d.ts are pre-compiled + committed (install copies them,
      # consumer needs no tsc). This gate fails if a committed artifact drifts from its .ts source
      # — the executable guard that keeps "ship pre-compiled" honest. Root tsc hoisted above.
      - name: shipped-rule compiled-artifact drift gate (#752)
        run: bash scripts/build-shipped-eslint-rules.sh --check
      # #755 fix: synth-and-wire.ts is precompiled into a zero-runtime-dep .mjs bundle
      # (ajv+semver inlined via esbuild). This gate fails if the committed bundle drifts
      # from a fresh esbuild rebuild — the executable guard for the precompiled artifact.
      - name: synth-bundle drift gate (#755)
        run: NODE_ENV=development bash scripts/build-synth-bundle.sh --check
      # #755 functional smoke test: runs the committed bundle zero-dep (no tsx, no ajv/semver
      # in PATH) against the real recipes + schemas to prove function, not just byte-equality.
      # AIF_SYNTH_PKG_ROOT overrides the four import.meta.url anchors that break when esbuild
      # collapses all modules to a single file (the bundle anchor fix). Verifies:
      #   (a) bundle loads without ENOENT crash (anchor #4 — internal-validators.ts),
      #   (b) loadEntries finds research entries (anchor #1 — load.ts STORE_ROOT),
      #   (c) synthesize produces rules (anchors #2/#3 — synthesize.ts RECIPES_ROOT/SCHEMA_PATH).
      - name: synth-bundle functional smoke test — proves anchor fixes + synthesis (#755)
        run: |
          set -euo pipefail
          export AIF_SYNTH_PKG_ROOT="${GITHUB_WORKSPACE}/packages/core"
          out=$(node packages/core/install/synth-and-wire.bundle.mjs \
            --stack react-next --path /tmp/no-eslint-config-smoke.mjs --dry-run 2>&1) || {
            echo "SMOKE FAIL: bundle exited non-zero (likely ENOENT anchor crash)"
            echo "$out"
            exit 1
          }
          echo "$out"
          if echo "$out" | grep -q 'emitted no rules'; then
            echo "SMOKE FAIL: synthesis emitted no rules — anchor break still present (STORE_ROOT or RECIPES_ROOT not resolving)"
            exit 1
          fi
          echo "✓ synth-bundle smoke test passed: bundle loaded and synthesized rules for react-next"
      # CI-gap option C sibling (render-suite-rot): the packages/core/render/ vitest
      # suite was never gated — only principles/ and hooks/ were — which is how a real
      # snapshot drift (R11 audit-self.yml → ci.yml: the manifest R11 row was updated in
      # #474 but the committed .snap was never regenerated) sat green-in-CI yet
      # red-only-on-full-local-run. The manifest→RULES.md `--check` job catches RULES.md
      # drift but not the vitest snapshot. Gate the render suite here. tsx is hoisted by
      # the root install above; ajv comes from the packages/core install.
      - name: Run packages/core/render/ suite (CI-gap option C sibling — gate the render snapshot)
        run: npm --prefix packages/core run test:render
      - name: Run prior-art trailer hook anti-tautology test (Phase 8.8 T9)
        run: bash tests/hooks/prior-art-trailer-hook.test.sh
      - name: Run §1.7 discipline trailer hook anti-tautology test (Wave 10.3)
        run: bash tests/hooks/s17-trailer-hook.test.sh
      - name: Run PREPUSH_UPSTREAM_REF override paired-negative (non-main base backstop)
        run: bash tests/hooks/prepush-upstream-ref.test.sh
      - name: Run pre-push base-ref stdin-detection paired-negative (hook-base-ref-detection I-phase)
        run: bash tests/hooks/prepush-fallback-base-ref.test.sh
      - name: Run merge-forward range paired-negative (trunk-reachable commits exempt, 2026-08-07)
        run: bash tests/hooks/prepush-merge-forward-range.test.sh
      - name: Run cross-checkout range paired-negative (HEAD ≠ pushed local_sha; §7 tree-scoped SSOT)
        run: bash tests/hooks/prepush-cross-checkout-range.test.sh
      - name: Run runtime-bridge dispatch opt-IN gate paired-negative (one-click-installer kickoff §7)
        run: bash tests/hooks/runtime-bridge-dispatch-optin.test.sh
      # Wired 2026-08-17. This suite had existed since the S6 twin generator shipped but was
      # invoked by NO workflow step and NO pre-push section — a test nobody ran. It is the only
      # coverage of scripts/generate-plugin-twins.sh, including the sandbox arms proving the
      # agents population re-syncs and never invents a twin. Principle 38 gates vitest↔CI
      # coverage only, so a stranded *.sh test is invisible to it (that wider gap is recorded,
      # not fixed here).
      - name: Run plugin twin generator acceptance (hooks + agents populations)
        run: bash tests/plugin/twin-generation.test.sh
      # Wired 2026-08-17 by principle 41. These eleven were git-tracked and invoked by NO
      # workflow step: tests/plugin/ (9 of 10), tests/aif-doctor/ (2), probe-channels (1).
      # meta-all-wired.test.sh had only ever gated tests/install-sh/, so every other shell-test
      # directory was un-gated. All eleven passed on first run; the twelfth
      # (tests/plugin/end-of-turn-reminder-zcode.test.sh) was RED on a pre-existing defect,
      # allowlisted in principle 41 with the diagnosis, and is wired below now that the defect
      # it caught — the lost S9C rollout arm — is repaired at the source.
      - name: Run plugin bootstrap test
        run: bash tests/plugin/bootstrap.test.sh
      - name: Run plugin hook-paths test
        run: bash tests/plugin/hook-paths.test.sh
      - name: Run plugin install-seam test
        run: bash tests/plugin/install-seam.test.sh
      - name: Run plugin manifest-valid test
        run: bash tests/plugin/manifest-valid.test.sh
      - name: Run plugin opencode-adapter test
        run: bash tests/plugin/opencode-adapter.test.sh
      - name: Run plugin run-hook test
        run: bash tests/plugin/run-hook.test.sh
      - name: Run plugin twin-emit test
        run: bash tests/plugin/twin-emit.test.sh
      - name: Run plugin warn-subagent-report ZCode arm test
        run: bash tests/plugin/warn-subagent-report-zcode.test.sh
      # Wired 2026-08-17 alongside the S9C rollout-arm restore. This is the acceptance test that
      # went RED for five hook revisions while running on no channel at all; it is the only
      # coverage of the multi-turn idle-suppression arm, so it must stay wired for the arm to be
      # regeneration-safe (the arm was lost exactly once nobody ran this).
      - name: Run plugin end-of-turn-reminder ZCode multi-turn arm test
        run: bash tests/plugin/end-of-turn-reminder-zcode.test.sh
      # The generator's fail-closed guard. twin-generation.test.sh checks byte-identity AFTER a
      # regeneration, so it reports GREEN on a twin that was just silently clobbered; this one
      # covers the write itself. Sandboxed (throwaway clones), so it never touches the live tree.
      - name: Run plugin twin clobber guard test
        run: bash tests/plugin/twin-clobber-guard.test.sh
      # aif-doctor pair: both stub docker/gh explicitly and carry an in-file
      # "ENVIRONMENT-INDEPENDENCE PROOF" (must pass with real docker on PATH), so they are
      # hermetic on a clean runner — verified locally at 9/9 and 5/5.
      - name: Run aif-doctor heal test
        run: bash tests/aif-doctor/heal.test.sh
      - name: Run aif-doctor refresh-aif-base test
        run: bash tests/aif-doctor/refresh-aif-base.test.sh
      - name: Run probe-channels self-test
        run: bash scripts/probe-channels.test.sh

  install-sh-a:
    name: install-sh battery (shard A)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0  # install-sh tests copy the repo; full history is the safe default
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/core/package-lock.json
      - name: Install packages/core deps
        run: npm ci --prefix packages/core --silent
      - name: Install workspace deps (hoists tsx to root)
        run: npm install --silent
      - name: Run install-sh no-companion-blocks test (one-click-installer S1)
        run: bash tests/install-sh/no-companion-blocks.test.sh
      - name: Run install-sh bridge-guided test (one-click-installer S2)
        run: bash tests/install-sh/bridge-guided.test.sh
      - name: Run install-sh aif guided-install gating test (ledger #1597 A1-3/A1-4/A1-7)
        run: bash tests/install-sh/aif-guided-install-gating.test.sh
      - name: Run install-sh merge_fenced splice-failure test (ledger #1597 A1-8)
        run: bash tests/install-sh/merge-fenced-splice-failure.test.sh
      - name: Run install-sh GLM one-button test (beta-delivery-ux S4)
        run: bash tests/install-sh/glm-onebutton.test.sh
      - name: Run install-sh B1 stack-research-lookup test (multistack-augment-first #827 B1)
        run: bash tests/install-sh/b1-stack-research-lookup.test.sh
      - name: Run live-snippet wire oracle + override tests (live-research-default-delivery D1/D2/§6)
        run: npx --prefix packages/core vitest run --reporter=default packages/core/install/wire-live-snippet.test.ts packages/core/install/wire-synth-rules.test.ts
      - name: Run local-ci-sweep paired-negative (harvest sweep aggregator)
        run: bash scripts/run-local-ci-sweep.test.sh
      # Reverse direction of tests/install-sh/meta-all-wired.test.sh: every atomic command THIS
      # workflow runs must be reachable from the sweep's gate table, or carry an explicit
      # UNREACHABLE rationale. Without it the sweep's "green locally ⇒ green in CI" promise rests
      # on someone re-reading both lists (.claude/rules/attention-is-not-a-mechanism.md §1).
      - name: Run local-ci-sweep CI-coverage metatest (gate table mirrors this workflow)
        run: bash scripts/run-local-ci-sweep-coverage.test.sh
      # The ask-file gate's own channel is pre-push (the mailbox lives in the operator's
      # coordination store, which CI never has). Its detector still needs a CI channel, or
      # the only proof it fires is that someone ran it once — the paired-negative below is
      # hermetic (mktemp mailbox) and runs anywhere.
      - name: Run ask-file schema paired-negative (advisor-pattern §8 item 6)
        run: bash scripts/check-ask-files.test.sh
      - name: Run synth-bundle dep-parity paired-negative (phantom-drift guard)
        run: bash scripts/check-bundle-dep-parity.test.sh
      - name: Run synth-bundle cwd-independence test (build runs from any directory)
        run: bash scripts/build-synth-bundle.test.sh
      # Paired contract for the K4 contract-coverage emitter. The emitter is not a gate
      # (it always exits 0), so the negative leg is on its OUTPUT: a kickoff whose
      # host-verify block misses a permitted area must emit a CANDIDATE naming it, and a
      # kickoff whose block covers the allowlist must emit none. Wired here so the
      # emitter cannot go silently dead — an unwired can-it-fire proof is not a proof.
      - name: Run host-verify contract-coverage paired-negative (K4 emitter)
        run: bash scripts/host-verify-coverage.test.sh
      - name: Run install-sh audit-r4 shipped test (consumer-install-hardening F6)
        run: bash tests/install-sh/audit-r4-shipped.test.sh
      - name: Run install-sh hook-activation test (consumer-install-hardening F2)
        run: bash tests/install-sh/f2-hook-activation.test.sh
      - name: Run install-sh AGENTS scripts-shipped test (consumer-install-hardening F8)
        run: bash tests/install-sh/f8-agents-scripts-shipped.test.sh
      - name: Run install-sh .ai-factory SoT-materialized test (consumer-install-hardening F8d)
        run: bash tests/install-sh/f8d-ai-factory-sot-materialized.test.sh
      - name: Run install-sh AGENTS.md fenced co-ownership test (beta-ai-docs-agnosticism S1 D1b)
        run: bash tests/install-sh/fence-agents-coownership.test.sh
      - name: Run install-sh with-aif-suite flag test (F7 — operator-suite skills gated behind explicit opt-in)
        run: bash tests/install-sh/with-aif-suite-flag.test.sh
      - name: Run install-sh no-husky-init-advice test (consumer-install-hardening F8c)
        run: bash tests/install-sh/f8c-no-husky-init-advice.test.sh
      - name: Run install-sh prettierignore-generated-docs test (consumer-install-hardening F15)
        run: bash tests/install-sh/f15-prettierignore.test.sh
      - name: Run install-sh runtime-arming WARN test (consumer-install-hardening S3 V2)
        run: bash tests/install-sh/v2-strict-runtime-armed.test.sh
      - name: Run install-sh .nvmrc↔CI node-version drift WARN test (GH #509)
        run: bash tests/install-sh/nvmrc-ci-drift.test.sh
      - name: Run install-sh arch-boundaries shipped-config test (GH #534 — was present-but-unwired)
        run: bash tests/install-sh/gh-534-arch-boundaries.test.sh
      - name: Run install-sh C1 skill-context wiring test (was present-but-unwired)
        run: bash tests/install-sh/c1-wiring.test.sh
      - name: Run install-sh ship-orchestration-skills test (#500 — was present-but-unwired)
        run: bash tests/install-sh/ship-orchestration-skills.test.sh
      - name: install-sh — lychee-shipped-md-offline (consumer first-push link integrity, 2026-07-10 smoke)
        # Pinned release install (ci-tool-pinning.md §1). The 0.24.2 release tarball nests
        # the binary under lychee-x86_64-unknown-linux-gnu/, so --strip-components=1 is
        # load-bearing: without it lychee never lands on PATH and the test self-skips,
        # making this arm vacuous (PR #1272 run 31230567666 — a broken shipped link merged
        # green, fixed in PR #1304). The test's SKIP branch is therefore promoted to a hard
        # step failure here (attention-is-not-a-mechanism.md §1: no #hope-as-gate).
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/lychee.tgz"
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  $RUNNER_TEMP/lychee.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lychee.tgz" -C "$RUNNER_TEMP" --strip-components=1
          "$RUNNER_TEMP/lychee" --version
          PATH="$RUNNER_TEMP:$PATH" bash tests/install-sh/lychee-shipped-md-offline.test.sh | tee "$RUNNER_TEMP/lychee-test.out"
          if grep -qF 'SKIP: lychee not on PATH' "$RUNNER_TEMP/lychee-test.out"; then
            echo "::error::lychee-shipped-md-offline self-skipped despite the pinned install — this CI arm is vacuous; fix the PATH/extraction above"
            exit 1
          fi
      - name: install-sh — r2-na-marker (GH #547 C4 two-gates-one-marker)
        run: bash tests/install-sh/r2-na-marker.test.sh
      - name: install-sh — consumer-upgrade-path (--refresh acceptance gate — stale-refreshed + customise-survives)
        run: bash tests/install-sh/consumer-upgrade-path.test.sh
      - name: "install-sh — refresh regenerates eslint barrel (#876: --refresh re-derives index.mjs so a new rule isn't stranded)"
        run: bash tests/install-sh/refresh-regenerates-barrel.test.sh
      - name: install-sh — gh-636 ensure-tsx-root (install guarantees tsx resolves from workspace root; --full/offer/warn)
        run: bash tests/install-sh/gh-636-ensure-tsx-root.test.sh
      - name: install-sh — f17 lint rules planted-violation (post-install liveness smoke Check3 Arm ii)
        run: bash tests/install-sh/f17-lint-rules-planted-violation.test.sh
      - name: "install-sh — f18 eslint non-TS no-crash (#973: strictTypeChecked must not fatal on .js/.cjs/.mjs outside tsconfig)"
        run: bash tests/install-sh/f18-eslint-nonts-no-crash.test.sh
      - name: "install-sh — f19 fences-fire load-probe (#976: self-verify must load-probe PLACED configs, not just the fixture)"
        run: bash tests/install-sh/f19-fences-fire-load-probe.test.sh
      - name: "install-sh — check-fences-fire FULL barrel (#838: R12 ACTIVE on react-next; neutered-R12 teeth; partial-barrel stacks not false-RED)"
        run: bash tests/install-sh/check-fences-fire-full-barrel.test.sh
      - name: install-sh — lib-helpers unit test (O1 guard regression + all helpers exposed)
        run: bash tests/install-sh/lib-helpers.test.sh
      - name: "install-sh — tool-decisions seed integration (S3: deps-hash loop fires on seeded state)"
        run: bash tests/install-sh/tool-decisions-seed-integration.test.sh
      - name: "install-sh — per-workspace stack detect (§13.5 multi-stack monorepo I-2 Layer 1: {dir→stack} map, neither stack dropped)"
        run: bash tests/install-sh/workspace-stack-detect.test.sh
      - name: Run install-sh meta-gate — every install-sh test is wired in CI (closes armed-but-not-fired)
        run: bash tests/install-sh/meta-all-wired.test.sh

