  # --noEmit` was a local-only `package.json` script, never gated, so a type
  # error could (and did, Wave 10.4) reach main green. Runs every workspace via
  # the root `npm run typecheck --workspaces` aggregate; fails on any error.
  typecheck:
    name: TypeScript typecheck (tsc --noEmit, all workspaces)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Install workspace deps
        run: npm install --silent
      - name: Typecheck all workspaces (tsc --noEmit)
        run: npm run typecheck

  # Last-resort CI mirror of the pre-push §1.7 + §7 Prior-art trailer checks, run
  # over the REAL PR commit range (origin/main..HEAD) through the PREPUSH_ONLY seam
  # in packages/core/hooks/pre-push.ts. Closes the `--no-verify` bypass: pre-push
  # runs only on the developer machine, so a bypassed push would otherwise reach
  # main with no trailer enforcement and no record.
  #   §1.7 is HARD-ENFORCED here (S17_WARN_ONLY=false on the step) so the last-resort
  #     gate blocks regardless of the pre-push calibration default — without this the
  #     step would be green-but-warn-only until the pre-push flip (#119) lands, i.e. a
  #     named gate that never fires (false-negative theatre). The CI gate is strict.
  #   §7 base (trailer missing/invalid) always blocks; §7 substance (`Prior-art:
  #     skipped` on a capability commit) stays warn-only — Option B, the documented
  #     CLAUDE.md escape hatch must not be hard-blocked here.
  # PR-only gate (the merge-time backstop; reused logic, no duplication).
  pr-commit-trailers:
    name: PR commit trailers — §1.7 + Prior-art (real-commit backstop)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so <base>..HEAD resolves the PR commits
          ref: ${{ github.event.pull_request.head.sha }}  # PR tip, not the synthetic merge commit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Install workspace deps (hoists tsx to root)
        run: npm install --silent
      - name: Ensure PR base ref is present
        # Diff against the actual PR base (github.base_ref), not a hard-coded
        # origin/main — so the backstop also gates PRs targeting a non-main base
        # (epic/staging, §13.40 automerge plan). base_ref via env, not inline
        # ${{…}} in run:, to avoid template-injection (zizmor). Fail loudly if the
        # base is unresolvable: pre-push.ts's upstreamExists() would otherwise
        # SILENTLY SKIP the checks (rc 0) — a false-pass that defeats the backstop.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --quiet origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git rev-parse --verify "origin/${BASE_REF}" >/dev/null \
            || { echo "::error::base ref origin/${BASE_REF} not resolvable — refusing to skip the backstop"; exit 1; }
      - name: §1.7 discipline-trailer check over PR commits (hard-enforced)
        # Promotion exemption: a staging→main PR re-checks the SAME commits this
        # job already enforced at each feature→staging merge (it runs there too).
        # The 134-commit promotion range inevitably includes trailerless commits
        # (dependabot bumps, merge commits), so promotions are ALWAYS red and
        # train routine admin-override (#discipline-theatre). Tolerate failures on
        # promotion ONLY — the step still runs and logs violations (record kept),
        # but no longer blocks. All non-promotion PRs keep hard enforcement.
        continue-on-error: ${{ github.base_ref == 'main' && github.head_ref == 'staging' }}
        env:
          S17_WARN_ONLY: 'false'
          S17_SUBSTANCE_WARN_ONLY: 'false'
          PREPUSH_UPSTREAM_REF: origin/${{ github.base_ref }}
        run: PREPUSH_ONLY=s17 npx tsx packages/core/hooks/pre-push.ts
      - name: §7 Prior-art trailer check over PR commits (base + substance both block)
        # Same promotion exemption as the §1.7 step above (head=staging && base=main).
        # Substance arm: warn-only until 2026-07-25 (Option B calibration), enforcing since —
        # the default in pre-push.ts priorArtSection flipped, and this step deliberately does
        # NOT pin PA_SUBSTANCE_WARN_ONLY so it tracks that default (unlike the §1.7 step above,
        # which pins its arms explicitly). Population note: this arm checks EACH branch commit,
        # while pr-body-prior-art.yml checks the PR body — a granular branch commit carrying
        # `Prior-art: skipped` now fails here even when the PR body carries a positive trailer.
        continue-on-error: ${{ github.base_ref == 'main' && github.head_ref == 'staging' }}
        env:
          PREPUSH_UPSTREAM_REF: origin/${{ github.base_ref }}
        run: PREPUSH_ONLY=prior-art npx tsx packages/core/hooks/pre-push.ts

  enforce-husky-presence:
    name: Verify .husky/ hooks exist and are non-trivial
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Verify .husky/ hooks exist and are executable
        run: |
          for hook in .husky/pre-commit .husky/pre-push; do
            test -f "$hook" || { echo "::error::missing $hook"; exit 1; }
            test -x "$hook" || { echo "::error::$hook not executable"; exit 1; }
            # non-empty + non-trivial (not just exit 0). Wave 10.1: the pre-push
            # hook may delegate its probes to the TS orchestrator
            # (packages/core/hooks/pre-push.ts) rather than inline them, so the
            # dispatch reference counts as non-trivial too.
            grep -qE '\b(actionlint|zizmor|bash -n|json\.load|yaml\.safe_load)\b|packages/core/hooks/pre-push\.ts' "$hook" \
              || { echo "::error::$hook lacks expected probes (looks empty/stub)"; exit 1; }
          done
          echo "✓ .husky/ hooks present, executable, non-trivial"

  framework-self-install-ts-server:
    name: Self-install on tmp consumer (ts-server)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Install python pyyaml (required by audit probes)
        run: pip install pyyaml==6.0.2
      - name: Install packages/core deps (remark + vitest for audit-ai-docs.test.ts)
        run: npm ci --prefix "$GITHUB_WORKSPACE/packages/core" --silent
      - name: Self-install on tmp consumer (ts-server preset)
        run: |
          mkdir -p /tmp/fake-consumer-ts && cd /tmp/fake-consumer-ts
          git init --quiet
          git config user.email "ci@example.com"
          git config user.name "CI"
          echo '{"name":"fake-consumer-ts","version":"0.0.0","private":true}' > package.json
          bash "$GITHUB_WORKSPACE/install.sh" ts-server
      - name: Run framework own audits (Wave 10.4 — vitest, ts-server)
        run: |
          cd "$GITHUB_WORKSPACE"
          npx --prefix packages/core vitest run --reporter=default packages/core/audit-self/audit-ai-docs.test.ts || \
            { echo "::error::framework audits failed (ts-server consumer)"; exit 1; }

  framework-self-install-react-next:
    name: Self-install on tmp consumer (react-next)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Install python pyyaml (required by audit probes)
        run: pip install pyyaml==6.0.2
      - name: Install packages/core deps (remark + vitest for audit-ai-docs.test.ts)
        run: npm ci --prefix "$GITHUB_WORKSPACE/packages/core" --silent
      - name: Self-install on tmp consumer (react-next preset)
        run: |
          mkdir -p /tmp/fake-consumer-rn && cd /tmp/fake-consumer-rn
          git init --quiet
          git config user.email "ci@example.com"
          git config user.name "CI"
          echo '{"name":"fake-consumer-rn","version":"0.0.0","private":true}' > package.json
          # next.config.js marks the consumer as react-next; explicit stack passed to install.sh
          echo 'module.exports = {};' > next.config.js
          bash "$GITHUB_WORKSPACE/install.sh" react-next
      - name: Run framework own audits (Wave 10.4 — vitest, react-next)
        run: |
          cd "$GITHUB_WORKSPACE"
          npx --prefix packages/core vitest run --reporter=default packages/core/audit-self/audit-ai-docs.test.ts || \
            { echo "::error::framework audits failed (react-next consumer)"; exit 1; }

  # Closes the #779 test-gap surfaced in PR #781. The self-install jobs above prove files
  # LAND on a fresh consumer; the byte-identical snapshot + principle 27 prove the copy-list
  # is COMPLETE — but NOTHING ran the installed consumer's `npm run validate`, so a "files
  # landed" green hid a `validate` RED. #779 was exactly that: #735 (edef3b97) vendored the
  # eslint-rules barrel + guard-liveness.ts (which imports eslint) into the consumer, and the
  # two shipped consumer gates then regressed — format:check on the newly-vendored
  # packages/core/eslint-rules/** (un-ignored), arch:check on guard-liveness's `import
  # { Linter } from 'eslint'` tripping dependency-cruiser's no-non-package-json — while every
  # ship-completeness check stayed green. This arm runs the actual consumer gates #779 regressed.
  #
  # Scope = format:check + arch:check — the two gates #779 regressed (PR #781), NOT the full
  # `npm run validate`: its other arms (test=vitest, audit:docs, typecheck) cannot be green on
  # a minimal skeleton without fabricating a whole project. A single prettier-clean src/index.ts
  # is seeded so tsconfig has inputs (else tsc/depcruise abort with TS18003 on an empty tree)
  # AND depcruise actually cruises the vendored packages/core/** — i.e. arch:check exercises the
  # exact #779 surface (verified: reverting #779's depcruise exclude reds this arm with the
  # original `no-non-package-json: …/guard-liveness.ts → node_modules/eslint/…` error).
  #
  # Deterministic + API-free (prettier + dependency-cruiser, no LLM) — complies with
  # .claude/rules/no-paid-llm-in-ci.md. `install.sh <stack> --full` is the framework-install
  # core of `./setup -y <stack>`; the wrapper additionally installs Claude-plugin companions +
  # the aif runtime-bridge, which are operator-environment satellites — they write no consumer
  # files validate checks and would add non-hermetic network steps, so the consumer tree and
  # validate result are identical. ts-server + react-next match the self-install coverage above;
  # react-spa/react-native are a follow-up (they ship preset RULES/ARCHITECTURE docs not yet in
  # the shipped .prettierignore — a separate latent fresh-install validate-RED, distinct from #779).
  framework-fresh-install-validate:
    name: "Fresh-install validate smoke (${{ matrix.stack }}) — closes #779"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stack: [ts-server, react-next, react-spa, react-native]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: "Fresh ./setup -y install (install.sh --full) into a tmp consumer"
        # STACK via env (not inline ${{…}} in run:) to avoid template-injection (zizmor). The
        # value is a GitHub-controlled matrix token from the allowlist above.
        env:
          STACK: ${{ matrix.stack }}
        run: |
          CONSUMER=$(mktemp -d)
          cd "$CONSUMER"
          git init --quiet
          git config user.email "ci@example.com"
          git config user.name "CI"
          echo '{"name":"fresh-validate-consumer","version":"0.0.0","private":true}' > package.json
          # NOTE: no src/ yet — install.sh resolves arch:check's target to "." when no src/
          # exists at install time (setup.d/70-deps.sh), which is what makes depcruise cruise the
          # vendored packages/core/** (the #779 surface). Seeding src/ happens AFTER install below.
          bash "$GITHUB_WORKSPACE/install.sh" "$STACK" --full
          echo "CONSUMER=$CONSUMER" >> "$GITHUB_ENV"
      - name: Seed a minimal source module (so the validate arms have inputs)
        # Added AFTER install so the arch:check target stayed "." (above). A single prettier-clean
        # module gives tsconfig inputs — without it tsc/depcruise abort with TS18003 on an empty
        # tree — while target="." keeps the vendored packages/core/** in depcruise's scope. No
        # string literal (the consumer ships .prettierrc.json with singleQuote) and no ${…}/backtick
        # so the line is prettier-config-agnostic AND shellcheck-clean (SC2016). No type annotation
        # either: the ts-server/react-next/react-spa typed configs enable
        # @typescript-eslint/no-inferrable-types, which flags `: number` on a literal — the
        # un-annotated form is lint-clean on all 4 stacks (the lint arm below runs for every stack).
        run: |
          cd "$CONSUMER"
          mkdir -p src
          printf 'export const answer = 42;\n' > src/index.ts
      - name: Assert the consumer toolchain installed (else the validate gate is vacuous)
        run: |
          cd "$CONSUMER"
          for bin in prettier depcruise; do
            test -x "node_modules/.bin/$bin" \
              || { echo "::error::$bin not installed — install.sh --full dep install failed; the validate gate cannot run (false-green guard)"; exit 1; }
          done
          echo "✓ consumer toolchain present (prettier + dependency-cruiser)"
      - name: "Consumer: npm run format:check (the #779 prettier gate)"
        run: |
          cd "$CONSUMER"
          npm run format:check
      - name: "Consumer: npm run arch:check (the #779 dependency-cruiser gate)"
        run: |
          cd "$CONSUMER"
          npm run arch:check
      - name: "Consumer: npm run lint (all stacks — GH #779 lint follow-up)"
        # All 4 stacks run the consumer's `npm run lint` (eslint . --max-warnings=0). A fresh
        # `install.sh <stack> --full` vendors the AIF framework namespace (eslint-rules-local/**,
        # packages/core/**, scripts/audit-r4.ts, the root .mjs/.cjs/.ts configs) into the consumer
        # tree. `eslint .` walks all of it, so each stack's eslint config must ignore that namespace
        # or it false-fails on files the consumer never authored:
        #   • react-native (#787): @react-native's espree @ es2015 parse-errors on the .mjs + a
        #     dot-notation warn on the vendored .ts → fixed in eslint.config.rn-common.mjs `ignores`
        #     (plus a standalone `typescript` devdep the --legacy-peer-deps install had dropped).
        #   • ts-server / react-next / react-spa (this PR): the typescript-eslint type-aware configs
        #     (strictTypeChecked + projectService) fatal-error on the same vendored .mjs/.ts/.cjs
        #     (no type info / "not found by the project service") → fixed by adding the framework
        #     namespace to each stack's eslint config `ignores`.
        # Deterministic + API-free (eslint, no LLM) per .claude/rules/no-paid-llm-in-ci.md.
        run: |
          cd "$CONSUMER"
          test -x node_modules/.bin/eslint \
            || { echo "::error::eslint not installed — install.sh --full dep install failed; the lint gate cannot run (false-green guard)"; exit 1; }
          npm run lint

  framework-fresh-install-validate-multistack:
    # GH #807: the deps-installed e2e companion to tests/install-sh/multi-stack-monorepo.test.sh §9.
    # A fresh `install.sh ts-server --full` on a #793/#796 multi-stack monorepo (apps/api ts-server +
    # apps/mobile Expo, NO root eslint.config.mjs) used to make the root-anchored validate gates go
    # RED (check:globs/check:enforced exit 2; arch:check exit 1). The flat matrix job above installs
    # into a SINGLE-package consumer and never exercises the no-root-config path — this is the
    # genuinely-different monorepo fixture (⚑m3). It asserts the 3 deps-installed-meaningful gates:
    # check:globs + check:enforced (Batch-A per-workspace recursion) and arch:check (Batch-B root
    # .dependency-cruiser.cjs). format:check is covered deps-free by the §9 .prettierignore placement
    # assertion (its #807 surface is a brownfield consumer-.prettierrc mismatch, NOT reproduced by a
    # greenfield fixture whose configs are AIF-prettier-clean). Deterministic + API-free per
    # no-paid-llm-in-ci.md — NOT the full `npm run validate` (typecheck/test/lint arms depend on
    # per-workspace toolchain surfaces tracked under #808/#810, out of #807 scope).
    name: "Fresh-install validate smoke — multi-stack monorepo (closes #807)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: "Fresh install.sh ts-server --full into a multi-stack monorepo consumer"
        run: |
          CONSUMER=$(mktemp -d)
          cd "$CONSUMER"
          git init --quiet
          git config user.email "ci@example.com"
          git config user.name "CI"
          # npm-managed multi-stack monorepo: apps/api (ts-server) + apps/mobile (Expo). NO
          # pnpm-workspace.yaml — per-workspace detection (_workspace_pkg_dirs) keys on the
          # apps/*/package.json dir-walk, NOT a pnpm manifest, so the multi-stack branch still fires;
          # meanwhile detect_pm falls to npm (the runner has npm, not pnpm) so `--full` actually
          # installs the toolchain. No workspace marker + no root src → AIF_ARCH_TARGET resolves to "."
          # (setup.d/70-deps.sh:35-44) — the same safe target the green flat job uses.
          # Root carries NO deps (exactly like the flat job): install.sh adds its 22 DEVDEPS and npm
          # auto-installs the typescript-eslint peer typescript. A root `typescript` pin here caused an
          # ERESOLVE/ETARGET on the first run (a non-existent 5.6.0 exact). Per-workspace `typescript`
          # keys below are detection SIGNALS only (never npm-resolved — no "workspaces" field).
          echo '{"name":"timeliner-mono","version":"0.0.0","private":true}' > package.json
          # apps/api → ts-server (Hono). A boundary source file under src/routes so check:globs
          # exercises the real glob-liveness recursion (not the trivial "no source → skip").
          mkdir -p apps/api/src/routes
          echo '{"name":"@timeliner/api","dependencies":{"hono":"4.0.0"},"devDependencies":{"typescript":"5.6.0"}}' > apps/api/package.json
          printf 'export const users = 1;\n' > apps/api/src/routes/users.ts
          # apps/mobile → react-native/Expo (ships NO RULE_GLOBS.boundary → the gate skips it).
          mkdir -p apps/mobile
          echo '{"name":"@timeliner/mobile","dependencies":{"expo":"~52.0.0","react-native":"0.76.0","react":"18.3.0"}}' > apps/mobile/package.json
          bash "$GITHUB_WORKSPACE/install.sh" ts-server --full
          echo "CONSUMER=$CONSUMER" >> "$GITHUB_ENV"
      - name: Assert the consumer toolchain installed (else the gates are vacuous)
        run: |
          cd "$CONSUMER"
          for bin in eslint depcruise; do
            test -x "node_modules/.bin/$bin" \
              || { echo "::error::$bin not installed — install.sh --full dep install failed; the multi-stack gate cannot run (false-green guard)"; exit 1; }
          done
          echo "✓ consumer toolchain present (eslint + dependency-cruiser)"
      - name: "Consumer (multi-stack): the deps-installed #807 gates must be green"
        # check:globs + check:enforced recurse per-workspace (Batch A); arch:check needs the root
        # .dependency-cruiser.cjs the multi-stack branch now places (Batch B). All three were RED on a
        # no-root-config monorepo before the fix (check:globs/enforced exit 2; arch:check exit 1).
        # check:enforced runs `eslint --print-config` per workspace (eslint asserted above); apps/api
        # has no zod boundary and apps/mobile no boundary tokens → both skip R2 cleanly → exit 0.
        # format:check is covered deps-free by multi-stack-monorepo.test.sh §9 (Batch C placement).
        # Deterministic + API-free per no-paid-llm-in-ci.md.
        run: |
          cd "$CONSUMER"
          npm run check:globs
          npm run check:enforced
          npm run arch:check
          echo "✓ multi-stack monorepo: check:globs + check:enforced + arch:check all green (#807)"

  framework-self-detect:
    name: Detector v1 — self-application snapshot (L1 invariant)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Install workspace deps (hoists tsx + transitive semver)
        run: npm install --silent
      - name: Detect this repo and diff against frozen snapshot
        run: |
          ACTUAL=$(npm --prefix packages/core run detect --silent -- "$GITHUB_WORKSPACE")
          EXPECTED=$(cat packages/core/detector/expected-self-detect.json)
          if ! diff <(echo "$ACTUAL" | jq -S .) <(echo "$EXPECTED" | jq -S .); then
            echo "::error::detector self-application snapshot drift — update packages/core/detector/expected-self-detect.json or fix the regression"
            exit 1
          fi
          echo "✓ self-detect snapshot stable"
      # install.sh replaced the retired setup.sh wrapper here (2026-07-10); it refuses to run
      # inside the package dir, so the probe targets a minimal tmp consumer instead.
      - name: Verify install.sh --dry-run idempotent (stack from detect)
        run: |
          DETECTED=$(npm --prefix packages/core run detect --silent -- "$GITHUB_WORKSPACE" | jq -r .stack)
          mkdir -p /tmp/dryrun-consumer && cd /tmp/dryrun-consumer
          git init --quiet
          echo '{"name":"dryrun-consumer","version":"0.0.0","private":true}' > package.json
          bash "$GITHUB_WORKSPACE/install.sh" "$DETECTED" --dry-run > /tmp/run1.txt 2>&1
          bash "$GITHUB_WORKSPACE/install.sh" "$DETECTED" --dry-run > /tmp/run2.txt 2>&1
          if ! diff /tmp/run1.txt /tmp/run2.txt > /dev/null; then
            echo "::error::install.sh --dry-run is not idempotent — L1 acceptance (a) violated"
            diff /tmp/run1.txt /tmp/run2.txt
            exit 1
          fi
          echo "✓ install.sh --dry-run idempotent (L1 acceptance a)"

  framework-self-research:
    name: Research Agent v1 — self-application snapshot (L2 invariant)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Install workspace deps (hoists tsx + transitive semver + ajv)
        run: npm install --silent
      - name: Run research --self and diff against frozen snapshot
        run: |
          ACTUAL=$(npm --prefix packages/core run research --silent -- --self "$GITHUB_WORKSPACE")
          EXPECTED=$(cat packages/core/research/expected-self-research.json)
          if ! diff <(echo "$ACTUAL" | jq -S .) <(echo "$EXPECTED" | jq -S .); then
            echo "::error::research self-application snapshot drift — fix the doc divergence or update packages/core/research/expected-self-research.json"
            exit 1
          fi
          echo "✓ self-research snapshot stable (L2 invariant b)"
      - name: Drift detection on canonical own-doc sources (L2 invariant a)
        run: |
          MISMATCHES=$(npm --prefix packages/core run research --silent -- --self "$GITHUB_WORKSPACE" | jq '.drift.mismatches | length')
          if [ "$MISMATCHES" != "0" ]; then
            echo "::error::symbolic drift detected in skills/SKILL.md / references/{overview,ai-traps}.md"
            npm --prefix packages/core run research --silent -- --self "$GITHUB_WORKSPACE" | jq '.drift.mismatches'
            exit 1
          fi
          echo "✓ zero drift across the 3 canonical self-app sources (L2 invariant a)"

  framework-self-synth:
    name: Synthesizer v1 — self-application snapshot (L3 invariant a)
    runs-on: ubuntu-latest
    needs: principles-meta-tests
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Install workspace deps
        run: npm install --silent
      - name: Synth on own repo and diff against frozen snapshot
        run: |
          ACTUAL=$(npm --prefix packages/core run synth --silent -- "$GITHUB_WORKSPACE")
          EXPECTED=$(cat packages/core/synthesizer/expected-self-synth.json)
          if ! diff <(echo "$ACTUAL" | jq -S .) <(echo "$EXPECTED" | jq -S .); then
            echo "::error::synthesizer self-application snapshot drift — fix the regression or update packages/core/synthesizer/expected-self-synth.json"
            exit 1
          fi
          echo "✓ self-synth snapshot stable (own repo, ts-server, no patterns)"
      - name: Synth on next-16 fixture and diff against frozen snapshot
        run: |
          FIXTURE="$GITHUB_WORKSPACE/packages/core/synthesizer/fixtures/next-16-fixture"
          ACTUAL=$(npm --prefix packages/core run synth --silent -- "$FIXTURE")
          EXPECTED=$(cat packages/core/synthesizer/expected-fixture-synth.json)
          if ! diff <(echo "$ACTUAL" | jq -S .) <(echo "$EXPECTED" | jq -S .); then
            echo "::error::synthesizer fixture snapshot drift — fix the regression or update packages/core/synthesizer/expected-fixture-synth.json"
            exit 1
          fi
          echo "✓ fixture-synth snapshot stable (next-16, 3 rules)"

  framework-self-validate:
    name: Validator v1 — self-application snapshot (L4 invariant)
    runs-on: ubuntu-latest
    needs: principles-meta-tests
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Install workspace deps (hoists eslint + ts-eslint)
        run: npm install --silent
      - name: Validate own repo synth output and diff against frozen snapshot
        run: |
          ACTUAL=$(npm --prefix packages/core run validate --silent -- "$GITHUB_WORKSPACE")
          EXPECTED=$(cat packages/core/validator/expected-self-validate.json)
          if ! diff <(echo "$ACTUAL" | jq -S .) <(echo "$EXPECTED" | jq -S .); then
            echo "::error::validator self-application snapshot drift — fix the regression or update packages/core/validator/expected-self-validate.json"
            exit 1
          fi
          echo "✓ self-validate snapshot stable (own repo, all gates pass/n/a)"
      - name: Validate next-16 fixture and diff against frozen snapshot
        run: |
          FIXTURE="$GITHUB_WORKSPACE/packages/core/synthesizer/fixtures/next-16-fixture"
          ACTUAL=$(npm --prefix packages/core run validate --silent -- "$FIXTURE")
          EXPECTED=$(cat packages/core/validator/expected-fixture-validate.json)
          if ! diff <(echo "$ACTUAL" | jq -S .) <(echo "$EXPECTED" | jq -S .); then
            echo "::error::validator fixture snapshot drift — fix the regression or update packages/core/validator/expected-fixture-validate.json"
            exit 1
          fi
          echo "✓ fixture-validate snapshot stable (next-16, all 4 REQUIRED gates pass)"
      - name: Emit aif-gate-result JSON to job summary (Phase 8 — closes Phase 11.1 partial)
        run: |
          # Per AIF SKILL.md "Append machine-readable gate result". Orchestrators
          # downstream of /aif-verify parse this block; emission is non-blocking
          # and structurally compatible with aif-comparison.md §7 11.1.
          GATE_RESULT=$(npm --prefix packages/core run validate --silent -- --aif-gate-result "$GITHUB_WORKSPACE")
          {
            echo '## aif-gate-result (rules)';
            echo '```json';
            echo "$GATE_RESULT";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✓ aif-gate-result emitted to job summary"

  framework-self-install-validated:
    name: Installer v1 — self-application snapshot (L5 invariant)
    runs-on: ubuntu-latest
    needs: principles-meta-tests
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Install workspace deps
        run: npm install --silent
      - name: Synth → install → diff deterministic shape vs frozen snapshot
        run: |
          TMP_CONSUMER=$(mktemp -d)
          npm --prefix packages/core run synth --silent -- "$GITHUB_WORKSPACE" > /tmp/synth.json
          npm --prefix packages/core run install:synth --silent -- "$TMP_CONSUMER" --from-synth /tmp/synth.json > /tmp/install-report.json
          SHAPE=$(jq -n \
            --slurpfile r /tmp/install-report.json \
            --slurpfile l "$TMP_CONSUMER/.ai-factory/synthesizer-output/rules-lock.json" \
            '{
              ok: $r[0].ok,
              installed: $r[0].installed,
              failuresCount: ($r[0].failures | length),
              artifactNames: [$r[0].artifacts[] | split("/") | last],
              lockShape: { schemaVersion: $l[0].schemaVersion, framework: $l[0].framework, version: $l[0].version, ruleIds: $l[0].ruleIds },
              preValidation: $r[0].preValidation,
              postValidation: $r[0].postValidation
            }')
          EXPECTED=$(cat packages/core/installer/expected-self-install.json)
          if ! diff <(echo "$SHAPE" | jq -S .) <(echo "$EXPECTED" | jq -S .); then
            echo "::error::installer self-application snapshot drift — fix the regression or update packages/core/installer/expected-self-install.json"
            exit 1
          fi
          echo "✓ self-install snapshot stable (own repo → tmp consumer, lock + post-validate green)"

  framework-provenance-anti-hand-edit:
    name: Provenance v1 — anti-hand-edit gate (S5 invariant)
    runs-on: ubuntu-latest
    needs: principles-meta-tests
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Install workspace deps
        run: npm install --silent
      - name: Emit a declarative forbid bundle, verify clean, then prove it reds on a hand-edit
        run: |
          # S5: the synthesizer is the SOLE writer of emitted rule files. This job
          # proves both directions in CI — a clean generator output verifies (exit 0),
          # and a hand-edit of the emitted rule content reds the verifier (exit 1).
          FIXTURE="$GITHUB_WORKSPACE/packages/core/synthesizer/fixtures/s4-declarative-research-plan.json"
          TMP=$(mktemp -d)
          npm --prefix packages/core run synth --silent -- --from-research "$FIXTURE" --output "$TMP" > /dev/null

          # [1] clean bundle must pass.
          set +e
          npm --prefix packages/core run verify:provenance --silent -- "$TMP"
          CLEAN_RC=$?
          set -e
          if [ "$CLEAN_RC" -ne 0 ]; then
            echo "::error::S5 gate red on a freshly-emitted (un-edited) bundle — false positive (rc=$CLEAN_RC)"
            exit 1
          fi
          echo "✓ clean emitted bundle verifies (exit 0)"

          # [2] hand-edit one rule field in the emitted manifest (provenance left stale).
          M="$TMP/rules-manifest-additions.json"
          FIRST=$(jq -r 'keys[0]' "$M")
          jq --arg id "$FIRST" '.[$id].examples.bad += "\n// hand-edited"' "$M" > "$M.tmp"
          mv "$M.tmp" "$M"

          # [3] verifier MUST red on the hand-edit (the прогнанный отказ, not "should bе").
          set +e
          npm --prefix packages/core run verify:provenance --silent -- "$TMP"
          EDITED_RC=$?
          set -e
          if [ "$EDITED_RC" -eq 0 ]; then
            echo "::error::S5 anti-hand-edit gate FAILED to detect a hand-edit (verify exited 0 on a corrupted bundle)"
            exit 1
          fi
          echo "✓ S5 anti-hand-edit gate reds on a hand-edited generated file (exit $EDITED_RC)"

  phase-8-canonical-regen-acceptance:
    name: Phase 8 acceptance — canonical Next 15 regen ≥0.95 similarity
    runs-on: ubuntu-latest
    needs: principles-meta-tests
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Install workspace deps
        run: npm install --silent
      - name: Run canonical regen acceptance test (similarity ≥0.95)
        run: npm --prefix packages/core test --silent -- tests/acceptance/canonical-regen

  # actionlint + zizmor live here (moved from workflow-integrity.yml) so the
  # single required context `ci-success` can `needs:`-aggregate them — `needs:`
  # works only WITHIN one workflow file. audit-self has no `paths:` filter, so
  # they run on every PR and the required context always reports; a path-filtered
  # required check would deadlock non-workflow PRs (the bug this fixes).
  # workflow-integrity.yml keeps only the R11 branch-protection-assertion.
  # See docs/meta-factory/automerge-staging-plan.md §5.
  actionlint:
    name: actionlint — YAML & expression correctness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Run actionlint via reviewdog wrapper
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d  # v1.72.0 — pin and bump via Dependabot
        with:
          fail_level: error

  zizmor:
    name: zizmor — supply-chain audits
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55  # v5.5.0
        with:
          python-version: '3.12'
      - name: Install zizmor
        # Pinned for determinism — bumping zizmor is a deliberate edit.
        # 1.25.2 was pinned while 5 adhoc-packages findings (npm install --prefix steps)
        # were triaged. Those findings are now fixed via npm ci --prefix; pin bumped to
        # 1.26.1 so we track the current auditor and its tightened adhoc-packages rules.
        run: pip install zizmor==1.26.1
      - name: Run zizmor
        # Plain console output. zizmor exits non-zero on findings; that's the gate.
        # Avoiding SARIF upload keeps this runnable without GitHub Advanced Security.
        # Also scan the SHIPPED CI templates (#637) so they can't drift past the
        # gate — they live OUTSIDE .github/workflows/, so these are extra path args.
        # Keep this list in sync with zizmorTemplatesSection() in
        # packages/core/hooks/pre-push.ts (the HARD-gate twin). New presets added via
        # setup.d deliver_getff_workflow MUST be appended here AND there — the list
        # below drifted past cargo/python/react-spa/react-native for 4+ months (#130
        # was the last edit; presets landed in #661/#662/#996/#1080) because nothing
        # enforced parity. If you ship a new github-actions template, add its path
        # to BOTH places.
        run: >-
          zizmor --format plain .github/workflows/
          templates/ts-server/github-actions-ci.yml
          templates/ts-server/github-actions-workflow-integrity.yml
          packages/preset-next-15-canonical/templates/github-actions-ci-ui.yml
          packages/core/templates/cargo/github-actions-ci.yml
          packages/core/templates/python/github-actions-ci.yml
          packages/preset-react-spa/templates/github-actions-ci-ui.yml
          packages/preset-react-native/templates/github-actions-ci-ui.yml

  # enforcement-liveness-fix S5: f17 planted-violation test on Node 20 + 22 matrix.
  # Scoped to f17 only — proves barrel loads without tsx loader on both LTS versions.
  f17-node-compat:
    name: "f17 lint-rules planted-violation (Node ${{ matrix.node }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install workspace deps (provides tsx + tsc for barrel compilation)
        run: npm install --silent
      - name: Install packages/core deps (provides eslint binary for Arm ii)
        run: npm ci --prefix packages/core --silent
      - name: "f17 lint-rules planted-violation (Node ${{ matrix.node }})"
        run: bash tests/install-sh/f17-lint-rules-planted-violation.test.sh

  consumer-matrix-start-cell:
    # launch-preannounce-track S2: the consumer-matrix acceptance gate START CELL. Runs the real
    # `install.sh ts-server --full` into a FRESH pnpm workspace monorepo fixture (the fixture
    # installs its OWN deps — T-LPT-A) and asserts the umbrella §1 acceptance through the real
    # channels: self-verify verdict honesty (a), in-fixture toolchain + placed-config load (b), the
    # deterministic per-workspace validation gates green-on-clean (c), a planted R2 violation blocked
    # via scoped eslint + the lint-staged pre-commit shield + check:fences-fire (d), the false-positive
    # arm (e), and a clean-tree real git push (i). XFAIL #973 (root `eslint .` on a per-workspace
    # monorepo) is pinned as reproducing. Fail-closed: a missing tool is RED, never SKIP. Fixture is
    # S1-calibrated (s1-calibration-report.md §4). Deterministic + API-free per no-paid-llm-in-ci.md.
    name: "Consumer-matrix start cell — pnpm workspace monorepo (launch-preannounce-track S2)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Enable pnpm via corepack (the fixture is a pnpm workspace monorepo)
        run: corepack enable
      - name: Run the consumer-matrix start cell
        run: bash tests/consumer-matrix/pnpm-monorepo-cell.sh
        env:
          FRAMEWORK_ROOT: ${{ github.workspace }}

  # Single aggregate context for branch protection. `needs:` every other
  # audit-self PR job — including actionlint + zizmor above — so requiring just
  # `ci-success` gates them all, and stays correct as jobs are added/removed (vs
  # listing each context in protection, which silently drifts). if: always() so
  # the gate still runs (and can FAIL) when a need failed; pass/fail logic lives
  # in scripts/ci-success-gate.sh (paired-negative tested).
  ci-success:
    name: ci-success
    if: always()
    needs:
      - mechanical
      - actionlint
      - zizmor
      - rule-to-probe
      - probe-tests
      - manifest-render-check
      - principles-meta-tests
      - install-sh-a
      - install-sh-b
      - install-sh-c
      - typecheck
      - pr-commit-trailers
      - enforce-husky-presence
      - framework-self-install-ts-server
      - framework-self-install-react-next
      - framework-fresh-install-validate
      - framework-self-detect
      - framework-self-research
      - framework-self-synth
      - framework-self-validate
      - framework-self-install-validated
      - framework-provenance-anti-hand-edit
      - phase-8-canonical-regen-acceptance
      - f17-node-compat
      - consumer-matrix-start-cell
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Aggregate required-job results
        # results via env (not inline ${{…}} in run:) to avoid template-injection
        # (zizmor). The tokens are GitHub-controlled (success|failure|skipped|
        # cancelled); word-split intentionally into one arg per needed job.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # shellcheck disable=SC2086  # intentional word-split: one arg per job result
          bash scripts/ci-success-gate.sh $RESULTS
