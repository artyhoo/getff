# S4 bench C2 — grouped self-review pass (kickoff-s4 §3.5). 41 tests, one per `source`
# group (fixed grouping key — never merged/split to hit a call target). Same judge model as
# C1 (`sonnet`, pinned in provider.mjs — a delta across models measures the model, not the
# layer). Payload = same rubric bytes + numbered finding list, output keyed by row id.
# C2 is scored ONLY as a delta over C1, never as a standalone winner.
prompts:
  - '{{payload}}'
providers:
  - id: 'exec:node provider.mjs'
    label: s4-c2-sonnet
    config:
      timeout: 600000
tests: file://tests-c2.json
