# generated by getff — do not edit by hand
# getff Python enforcement workflow (python-delivery-v0). Runs the getff ast-grep structural
# rules + the ruff fast-path lint as FAILING gates on push / PR — the earliest reachable CI
# channel for the delivered Python rule-pack.
#
# Tool installs are version-PINNED per .claude/rules/ci-tool-pinning.md Rule A: the pins match
# what the getff framework CI itself fires (@ast-grep/cli@0.44.1, ruff==0.15.21) so the consumer's
# gate is deterministic across time and matched to the rules getff delivered. Bump these two pins
# deliberately (a float would make CI output depend on the registry's current "latest").
#
# Delivered by the getff Python lane into .github/workflows/getff-python.yml (a getff-namespaced
# filename — it never clobbers your own ci.yml). Delete this file to opt out of the getff gates.
name: getff Python enforcement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel stale runs when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Minimal default permissions
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # PRIMARY LANE — ast-grep structural rules (getff)
  # ─────────────────────────────────────────────
  getff-astgrep:
    name: ast-grep structural rules (getff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      # Pinned per ci-tool-pinning.md Rule A — matches the getff framework CI pin.
      - name: Install ast-grep (pinned)
        run: npm install -g @ast-grep/cli@0.44.1
      # Fails RED when a getff ast-grep rule fires (sgconfig.yml resolves .getff/astgrep-rules).
      - name: ast-grep scan (getff rules)
        run: ast-grep scan

  # ─────────────────────────────────────────────
  # FAST-PATH LANE — ruff TID import bans (getff)
  # ─────────────────────────────────────────────
  getff-ruff:
    name: ruff fast-path lint (getff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.12'
      # Pinned per ci-tool-pinning.md Rule A — matches the getff framework CI pin.
      - name: Install ruff (pinned)
        run: pip install ruff==0.15.21
      # Fails RED when a getff ruff ban fires (config = ruff.toml, or getff-ruff.toml if you kept
      # your own ruff config — point --config at whichever getff config the lane delivered).
      - name: ruff check
        run: ruff check .
