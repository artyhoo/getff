# generated by getff cargo backend v0 — do not edit by hand
# getff clippy severity projection (the "deny surface"). clippy.toml carries NO severity, so a
# banned call is only a WARNING and `cargo clippy` exits 0 over it (render-clippy.ts FF7003). This
# [lints.clippy] table projects the ban onto clippy's own lint-level ladder (allow -> warn -> deny
# -> forbid) so the ban FAILS the build (write-clippy.ts, the second surface).
#
# getff NEVER edits your Cargo.toml automatically (a bad merge would break your build). MERGE this
# table into your crate's Cargo.toml by hand — or set the same levels on the CI command line
# (`cargo clippy -- -D clippy::disallowed_methods`), which the delivered getff-cargo.yml gate does.
[lints.clippy]
disallowed_methods = "deny"
