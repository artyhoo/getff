# generated by getff — do not edit by hand
# getff Rust enforcement workflow (ecosystem-wiring W4). Runs the getff clippy bans as a FAILING
# gate on push / PR — the earliest reachable CI channel for the delivered Rust rule-pack.
#
# clippy ships WITH the consumer's own rustc (`rustup component add clippy`), so — unlike the
# getff Python lane's pinned ast-grep/ruff — this gate does NOT pin a Rust version: the consumer
# owns their toolchain (companion-install-principle.md — never version-manage the consumer's own
# stack). The `-D clippy::disallowed_*` flags make the getff clippy.toml bans build-FAILING
# regardless of whether you merged the [lints.clippy] deny projection into Cargo.toml.
#
# Delivered by the getff cargo lane into .github/workflows/getff-cargo.yml (a getff-namespaced
# filename — it never clobbers your own ci.yml). Delete this file to opt out of the getff gate.
name: getff Rust enforcement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel stale runs when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Minimal default permissions
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # PRIMARY LANE — clippy disallowed-* bans (getff)
  # ─────────────────────────────────────────────
  getff-clippy:
    name: clippy bans (getff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # clippy is a rustup component of the consumer's own toolchain — add it, do not pin rustc.
      - name: Add clippy component
        run: rustup component add clippy
      # Fails RED when the getff clippy.toml bans fire. `-D` promotes the getff lint families to
      # build-failing (clippy.toml carries no severity — render-clippy.ts FF7003), so the ban gates
      # even if the [lints.clippy] deny projection was not merged into Cargo.toml.
      - name: cargo clippy (getff bans)
        run: cargo clippy --all-targets -- -D clippy::disallowed_methods -D clippy::disallowed_types -D clippy::disallowed_macros
