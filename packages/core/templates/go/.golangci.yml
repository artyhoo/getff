# generated by getff go lane v0 — do not edit by hand
# getff go ban surface (adapter-jig J3). golangci-lint reads EXACTLY ONE .golangci.yml at the repo
# root (parity with clippy.toml from the cargo lane) — a sibling of ours would REPLACE the
# consumer's existing config, so the lane's collision matrix ships this verbatim on a fresh dir,
# or as getff-golangci.yml in a REFUSE cell (consumer keeps their own; ours is inert until they
# opt in). The CI workflow's `-E` flag makes the forbidigo ban build-FAILING regardless of any
# explicit severity merge (parity with the cargo lane's `-D clippy::disallowed_*`).
#
# The single ban is the go analogue of clippy.toml's `std::env::var` disallow — read configuration
# through the injected config accessor, never os.Getenv directly. Mirrors the cargo lane's
# «injected config, never env-var direct» discipline (kickoff §1 W4 → §2 J3 hard node).
linters:
  disable-all: true
  enable:
    - forbidigo
# KEY NAME IS LOAD-BEARING: the pattern field is `p`, NOT `pattern`. forbidigo's own struct tags it
# `Pattern string \`yaml:"p"\`` (golangci-lint v1.x vendors that struct verbatim; only the v2 config
# schema renamed it to `pattern`). Under the pinned v1.55.2 an unknown key is silently dropped, so
# `pattern:` left the regex EMPTY — and an empty regex matches every identifier. The failure is not
# a no-op but the loudest possible one: CI run 31093381580 flagged the package clause, the `string`
# type and `os.Args` in a file with no violation at all, each carrying our msg (which parsed fine,
# because `msg` IS a real key). Do not "modernise" this to `pattern:` without moving the pin.
#
# The regex carries no trailing `\(` on purpose: forbidigo matches the node's source text, which is
# `os.Getenv("HOME")` in literal mode but the bare `os.Getenv` once type analysis expands it. The
# paren-free form matches in BOTH modes; `os\.Getenv\(` would silently stop matching if the lane
# ever enables `analyze-types`. `os.Args` and other os.* calls stay unmatched either way.
linters-settings:
  forbidigo:
    forbid:
      - p: 'os\.Getenv'
        msg: 'Read configuration through the injected config accessor, never os.Getenv directly'
issues:
  # Build-failing severity is set via the CI gate's -E flag, not in this config. Promote to deny
  # by running `golangci-lint run -E forbidigo` (the getff-go.yml gate does exactly this).
  exclude-use-default: false
