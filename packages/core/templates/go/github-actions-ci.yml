# generated by getff — do not edit by hand
# getff Go enforcement workflow (adapter-jig J3). Runs the getff golangci-lint ban surface
# (forbidigo on os.Getenv) as a FAILING gate on push / PR — the earliest reachable CI channel
# for the delivered Go rule-pack.
#
# UNLIKE the cargo lane (which uses `rustup component add clippy` — clippy ships with the
# consumer's own rustc), golangci-lint is a SEPARATE binary not bundled with go itself. The
# lane pins both go-version AND golangci-lint-version per .claude/rules/ci-tool-pinning.md
# Rule A — exact pins only, no float. A pin bump is a deliberate edit that bumps this file +
# the framework mirror .github/workflows/audit-self.yml go arm together (F10 two-surface pin
# parity, arm P1).
#
# Delivered by the getff go lane into .github/workflows/getff-go.yml (a getff-namespaced
# filename — it never clobbers your own ci.yml). Delete this file to opt out of the getff gate.
name: getff Go enforcement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel stale runs when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Minimal default permissions
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # PRIMARY LANE — golangci-lint forbidigo bans (getff)
  # ─────────────────────────────────────────────
  getff-golangci:
    name: golangci-lint bans (getff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Exact-pinned go-version (ci-tool-pinning.md Rule A). actions/setup-go is the official
      # installer; the pin lives in the `go-version:` input, not as a bare `run: go install`.
      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.22.0'
          cache: false
      # Exact-pinned golangci-lint via go install @ <tag> (ci-tool-pinning.md Rule A). The
      # framework audit-self.yml mirror arm installs the SAME version; bump them in lockstep.
      - name: Install pinned golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.55.2
      # Fails RED when the getff .golangci.yml forbidigo ban fires on os.Getenv. The ban lives
      # in the consumer's delivered .golangci.yml (fresh cell) or getff-golangci.yml (REFUSE
      # cell, opt-in via --config flag).
      - name: golangci-lint run (getff bans)
        run: |
          set -euo pipefail
          if [ -f .golangci.yml ]; then
            golangci-lint run --enable forbidigo --config .golangci.yml ./...
          elif [ -f getff-golangci.yml ]; then
            echo "⚠ consumer .golangci.yml absent — running against getff-golangci.yml (REFUSE cell, opt-in)"
            golangci-lint run --enable forbidigo --config getff-golangci.yml ./...
          else
            echo "⚠ no getff go config found — skip (run 'install.sh go' to deliver)"
            exit 0
          fi
