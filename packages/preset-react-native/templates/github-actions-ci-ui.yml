name: CI (React Native)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # FAST CHECKS — parallel
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --prefer-offline
      - run: bash scripts/run-armed.sh npm run lint
      - run: bash scripts/run-armed.sh npm run format:check
      - name: Rule-glob liveness (custom ESLint rules must not be silently inert)
        run: bash scripts/run-armed.sh bash scripts/check-rule-globs.sh
      - name: Rule actually applied (R2 binds to boundary files, not just glob-matched)
        run: bash scripts/run-armed.sh bash scripts/check-rule-enforced.sh
      - name: lint-staged config resolves (binaries reachable before first commit)
        run: bash scripts/run-armed.sh bash scripts/check-lintstaged-resolves.sh
      # The fences getff ships must fire on known-bad input (not only be configured). Through the record:
      # recorded not-armed where it was red at install or where the project does not lint with ESLint.
      - name: getff's ESLint fences fire on known-bad input
        run: bash scripts/run-armed.sh bash scripts/check-fences-fire.sh
      # Every tool install in this repo's workflows pins a version (the pre-push hook's check, run on its
      # own). Through the record: not-armed where a workflow the project already had was unpinned.
      - name: tool installs in .github/workflows pin a version
        run: bash scripts/run-armed.sh bash scripts/check-ci-pins.sh
      # The generated rules' mutation pass (P5's runner): armed only when it went green at install. It
      # installs its own linter toolchain from the npm registry when the project lacks one, so on a
      # runner with no registry access an armed step goes red (exit 2); a runner that ran `npm ci`
      # has the registry. `npm run validate` is red on that exit 2 too, on purpose.
      - name: generated rules survive their mutation pass
        run: bash scripts/run-armed.sh bash scripts/run-generated-rule-mutation.sh
      - run: bash scripts/run-armed.sh npm run arch:check
      - name: Architecture boundary liveness (monorepo packages↛apps rule must not be silently absent)
        run: bash scripts/run-armed.sh bash scripts/check-arch-boundaries.sh

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --prefer-offline
      - run: bash scripts/run-armed.sh npm run typecheck

  # ─────────────────────────────────────────────
  # UNIT TESTS
  # ─────────────────────────────────────────────
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --prefer-offline
      - run: bash scripts/run-armed.sh npm test
        env:
          CI: 'true'

  # ─────────────────────────────────────────────
  # SECURITY
  # ─────────────────────────────────────────────
  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --prefer-offline
      - run: npm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # AI DOCUMENTATION AUDIT
  # ─────────────────────────────────────────────
  audit-ai-docs:
    name: AI documentation audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run audit-ai-docs.react-native.sh
        run: |
          if [ -x "scripts/audit-ai-docs.sh" ]; then
            bash scripts/run-armed.sh bash scripts/audit-ai-docs.sh
          fi
          if [ -x "audit-self/audit-ai-docs.react-native.sh" ]; then
            bash audit-self/audit-ai-docs.react-native.sh
          fi

  # ─────────────────────────────────────────────
  # FINAL GATE — required check for merge
  # ─────────────────────────────────────────────
  ci-success:
    name: CI passed
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test-unit
      - security
      - audit-ai-docs
    if: always()
    steps:
      - run: |
          for r in "${{ needs.lint.result }}" \
                  "${{ needs.typecheck.result }}" \
                  "${{ needs.test-unit.result }}" \
                  "${{ needs.security.result }}" \
                  "${{ needs.audit-ai-docs.result }}"; do
            [ "$r" = "success" ] || { echo "Failed job: $r"; exit 1; }
          done
          echo "All checks passed."
