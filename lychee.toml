# lychee.toml — config for the weekly LIVE link-checker CI job
# (.github/workflows/link-checker.yml). Scope: README.md, INSTALL*.md,
# docs/**, plugin/README.md — the project's public-facing showcase docs.
#
# Complements — does NOT duplicate — the existing OFFLINE, changed-file-only
# check in packages/core/hooks/pre-push.ts §8 (`lychee --offline` on the
# diff's *.md files, every push). That pre-push gate is the primary/earliest
# channel (rule-enforcement-channel-selection.md); this config backs the
# periodic full-sweep companion (same shape as guard-liveness-fullsweep.yml).

# Hosts that are structurally unreachable from a CI runner, are
# placeholder/example domains, or are verified (live, 2026-07) to block
# non-browser clients unconditionally (bot-detection 403 on HEAD *and* GET,
# with or without a browser User-Agent — confirmed via curl against several
# real, currently-live npm package pages) rather than actually being broken.
exclude = [
  # Exact historical citations blocked by non-browser security challenges,
  # reproduced 2026-10-18 after CI run 39138613013: all ten DeepWiki URLs
  # return 429 + x-vercel-mitigated: challenge / Vercel Security Checkpoint;
  # the two article URLs return 403 + Attention Required! | Cloudflare on
  # HEAD and GET with both lychee and browser user agents. Their contents
  # remain unverified by this HTTP audit. Preserve the citations; do not
  # exempt these hosts or accept 403/429 for other URLs. Remove an exception
  # when that exact page becomes reachable by the unmodified checker.
  '^https://deepwiki\.com/obra/superpowers/6\.3-visual-brainstorming-companion$',
  '^https://deepwiki\.com/search/describe-the-aifmcp-package-wh_3bda4062-8f45-4055-a316-0f371ed311a2$',
  '^https://deepwiki\.com/search/describe-the-aifruntime-packag_ef408848-368e-4d4a-870e-af9d51c1567f$',
  '^https://deepwiki\.com/search/describe-the-planner-implement_3216df38-d6a3-42ea-935b-58abc696b2ce$',
  '^https://deepwiki\.com/search/describe-the-watchdogs-error-c_11b95c86-96e3-4879-980b-85a882d538a3$',
  '^https://deepwiki\.com/search/does-superset-the-cli-codingag_7fb2a91a-6687-4433-abb8-72caa372f5fe$',
  '^https://deepwiki\.com/search/is-there-a-handofftask-annotat_7de90b12-5d36-4f6a-952f-5145f2245d78$',
  '^https://deepwiki\.com/search/list-all-major-features-and-ca_65216884-8277-49af-865e-50f39e88dcee$',
  '^https://deepwiki\.com/search/what-are-the-two-execution-mod_6ac0cfd0-3e83-4db7-8152-c67c9a7af074$',
  '^https://deepwiki\.com/search/where-is-the-pausedtrue-field_5b694046-a22b-45d7-a9ff-8d520cdb6ce1$',
  '^https://ronie\.medium\.com/agent-glossary-teaching-agents-our-shared-language-93bae9674b02$',
  '^https://towardsdatascience\.com/hybrid-ai-combining-deterministic-analytics-with-llm-reasoning/$',
  '^https?://localhost',
  '^https?://127\.0\.0\.1',
  '^https?://0\.0\.0\.0',
  '^wss?://',
  '^https?://([a-zA-Z0-9-]+\.)?example\.(com|org|net)',
  '^https?://(www\.)?npmjs\.com', # confirmed 403 on HEAD+GET regardless of UA — bot-block, not dead links
  '^https?://gptlint\.dev', # TLS handshake fails from non-browser clients (verified live 2026-07-10, curl exit 35)
  '^https?://explainx\.ai', # 200 from local network but consistent TIMEOUT from GitHub runners (2× on PR #1511, 2026-08-21; local curl -I → HTTP/2 200) — runner-path unreachable, not a dead link
  '/\.\.\.$', # the literal ellipsis placeholder '/...' — quoted inside an escaped code span (migration-ast stage-1); lychee's parser misreads it as a link. Unanchored so it also matches the root-dir-resolved file URL form. Placeholder class, same posture as example.* above — not a link.
  '/no-such-page\.md$', # the deliberate broken-link placeholder inside the docs-check DEFECT fixtures (tests/docs-check/fixtures/pages/) — those pages seed the checker's own live-fire arms; their dangling target is the test material, not drift. Unanchored file-URL form, same placeholder class as '/...' above. (getff-ai-site S0q harvest: the pre-push §8 arm walks changed md explicitly, which bypasses exclude_path.)
]

# Closed historical artifacts (CLAUDE.md «Artifact Ownership Contract»):
# research-patches are append-only one-patch-per-gap records; retros are
# «closed historical artifact post-merge»; superpowers specs/plans and phase
# research files are design-history records; generator-forbid-mvp is a closed
# umbrella's design folder. Their links describe repo state AT WRITE TIME —
# link rot in them is expected archaeology, not showcase drift, and «fixing»
# them would violate their append-only/frozen ownership. The LIVE operational
# docs (EXECUTION-PLAN.md, prior-art-evaluations.md, open-questions.md,
# docs/audits/**, runtime-bridge-setup.md, …) remain fully checked.
# triage-corpus/sources/ holds review reports preserved VERBATIM as blind
# corpus source material (design spec §2 W-7) — their relative links were
# written from their original untracked home and editing them would break
# the preserved-verbatim property the corpus depends on.
exclude_path = [
  'docs/meta-factory/research-patches/',
  'docs/meta-factory/retros/',
  'docs/meta-factory/generator-forbid-mvp/',
  'docs/meta-factory/phase-8-research\.md',
  'docs/meta-factory/triage-corpus/sources/',
  'docs/superpowers/',
]

# A `main`-pinned blob URL born on `staging` is expected-404 until the next
# promote, and that is a mechanism, not link rot: the plugin twin must be
# byte-identical to its source, so a link escaping the twin's directory is
# written as an absolute `blob/main/` URL the moment the file is authored — on
# `staging`, where `main` does not carry it yet. Measured: PR #1807 merged over
# exactly this RED (plugin/README.md:27 → 404), and the URL self-healed at
# promote #4 (research-patches/2026-09-21-main-pinned-blob-url-red-at-merge.md).
#
# Remap — rather than exclude — so the audit stays a real rot detector on this
# class: it checks the SAME path against the ref that carries it. A renamed or
# deleted target still 404s. Measured on lychee v0.24.2 (the version
# lycheeverse/lychee-action@e747777 installs by default) with the file this rule
# was written for: without the remap the URL is an error (exit 2), with it the
# check passes (exit 0), and a `blob/main/` URL whose path exists on NEITHER ref
# still fails (exit 2). The trade-off is stated and accepted: the audit verifies
# a ref the reader of a shipped twin does not follow. That gap closes at every
# promote, whereas an `exclude` would make the gate structurally unable to fail
# on the class it exists to police (attention-is-not-a-mechanism.md §2
# `#hope-as-gate`).
remap = [
  "https://github.com/artyhoo/getff/blob/main/ https://github.com/artyhoo/getff/blob/staging/",
]

# GitHub's own hosts appear ~340 times across the scoped docs (github.com,
# raw.githubusercontent.com); authenticating via the action's `token` input
# raises the rate limit substantially, but transient 429s/5xxs still happen
# under network flakiness unrelated to actual link rot — retry before failing.
# (lychee already falls back HEAD → GET by default when a host rejects HEAD,
# so no explicit `method` override is needed here.)
max_retries = 3
retry_wait_time = 5
timeout = 20
